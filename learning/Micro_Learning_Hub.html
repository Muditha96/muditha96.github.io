/* ---- QUIZ ---- */
const MOCKNOTE = {
  sd:'Mirrors the real CSWA-SD exactly: 30 questions, 60 minutes, 24 to pass (80%). The real exam is knowledge-only, so this is a true rehearsal.',
  s :'The real CSWA-S is 20 questions in 120 minutes, but three are hands-on modelling problems worth up to 20 points each. This drill is the theory half — allow modelling time separately.',
  p :'The real CSWP segments are almost entirely hands-on in SOLIDWORKS. This drills the knowledge and technique layer around them; topic 9 holds the official sample exam to work with SOLIDWORKS open.'
};
function exNow(){ return EXAMS[S.examId]; }
function qp(){ return S.prog.quiz[S.examId]; }
function exMastery(k){ const e=EXAMS[k];
  return pct(e.questions.filter(q=>S.prog.quiz[k].right[q.id]).length, e.questions.length); }

function vQuiz(){
  if(!S.examId){
    const cards=Object.keys(EXAMS).map(k=>{
      const e=EXAMS[k], m=exMastery(k), pr=S.prog.quiz[k];
      const best=pr.attempts.length?Math.max.apply(null,pr.attempts.map(a=>a.pct)):null;
      return '<button class="card tight" style="text-align:left;width:100%;color:#EFE7D6;border-left:5px solid '+e.accent+'" onclick="go(\'quiz\',{examId:\''+k+'\'})">'
        + '<div class="mn" style="color:'+e.accent+'">'+e.code+'</div>'
        + '<div class="mt" style="font-size:1.1em">'+esc(e.name)+'</div>'
        + '<div class="md" style="color:#A9BDB5;font-size:.9em;margin-top:5px">'+esc(e.tagline)+'</div>'
        + '<div class="bar" style="margin-top:12px"><i style="width:'+m+'%;background:'+e.accent+'"></i></div>'
        + '<div class="fnote">'+m+'% of '+e.questions.length+' correct'+(best!==null?' &middot; best mock '+best+'%':'')+'</div>'
        + '</button>';
    }).join('');
    return '<h1 class="display">Certification quiz</h1>'
      + '<p class="sub">'+totalQ()+' questions across the three SOLIDWORKS exams you are working through. Practice gives instant feedback; mocks run a clock.</p>'
      + '<div class="grid g2" style="margin-top:20px">'+cards+'</div>'
      + '<div class="card tight" style="margin-top:20px"><h3>Where these came from</h3>'
      + '<p class="muted" style="font-size:.9em">Formats, durations and pass marks are taken from solidworks.com and the official certification blog. '
      + 'The five CSWP questions in topic 9 are the <b>official published sample exam</b> with Dassault\'s own answer key. '
      + 'No live exam content appears anywhere in this app.</p>'
      + '<div class="navrow"><a class="btn sm ghost" href="advanced/solidworks-exam-prep/SolidWorks_Complete_Exam_Guide.html" target="_blank" rel="noopener">Open the full exam guide</a></div></div>';
  }
  const e=exNow(); setAccent(e.accent);
  if(S.pool.length) return vQuizRun();
  const p=qp();
  const wrongN=e.questions.filter(q=>p.wrong[q.id]&&!p.right[q.id]).length;
  const specRows=Object.keys(e.spec).map(k=>'<tr><th style="width:36%">'+esc(k)+'</th><td>'+e.spec[k]+'</td></tr>').join('');
  const topics=e.topics.map((t,i)=>{
    const qs=e.questions.filter(q=>q.topic===t.id);
    const m=pct(qs.filter(q=>p.right[q.id]).length, qs.length);
    const star=t.title.indexOf('★')===0;
    return '<div class="mod" style="--cc:'+e.accent+'"><div class="mi">'+(star?'★':(i+1))+'</div>'
      + '<div class="mb"><div class="mt">'+esc(t.title.replace('★ ',''))+'</div>'
      + '<div class="md">'+esc(t.blurb)+' &middot; '+qs.length+' questions</div></div>'
      + '<div class="ma"><span class="chip'+(m>=80?' good':m?' warn':'')+'">'+m+'%</span>'
      + '<button class="btn sm ghost" onclick="startQuiz(\'topic\',\''+t.id+'\')">Drill</button></div></div>';
  }).join('');
  return '<h1 class="display">'+e.code+'</h1><p class="sub">'+esc(e.name)+'</p>'
   + '<div class="navrow" style="margin:18px 0 20px">'
   + '<button class="btn" onclick="startQuiz(\'all\')">Practice all '+e.questions.length+'</button>'
   + '<button class="btn ghost" onclick="startQuiz(\'wrong\')"'+(wrongN?'':' disabled')+'>Review mistakes ('+wrongN+')</button>'
   + '<button class="btn ghost" onclick="startMock()">Timed mock</button>'
   + '<span class="spacer"></span><button class="btn ghost sm" onclick="go(\'quiz\',{examId:null})">All exams</button></div>'
   + '<h2>Official exam facts</h2><div class="tbl-wrap"><table>'+specRows+'</table></div>'
   + '<h2>Topics</h2>'+topics;
}

function startQuiz(mode, tid){
  const e=exNow(), p=qp();
  S.quizMode=mode;
  let pool;
  if(mode==='topic') pool=e.questions.filter(q=>q.topic===tid);
  else if(mode==='wrong') pool=e.questions.filter(q=>p.wrong[q.id]&&!p.right[q.id]);
  else pool=e.questions.slice();
  S.pool=shuffled(pool); S.qIdx=0; S.sel=[]; S.answered=false;
  render(); window.scrollTo(0,0);
}
function endQuiz(){ S.pool=[]; S.qIdx=0; S.sel=[]; S.answered=false; render(); window.scrollTo(0,0); }
function pickOpt(i){
  if(S.answered) return;
  const q=S.pool[S.qIdx];
  if(isMulti(q)){ const at=S.sel.indexOf(i); if(at>=0)S.sel.splice(at,1); else S.sel.push(i); render(); }
  else { S.sel=[i]; checkAns(); }
}
function checkAns(){
  if(S.answered||!S.sel.length) return;
  const q=S.pool[S.qIdx], p=qp();
  if(sameSet(S.sel,corSet(q))) p.right[q.id]=(p.right[q.id]||0)+1;
  else p.wrong[q.id]=(p.wrong[q.id]||0)+1;
  saveProg(); S.answered=true; render();
}
function nextQ(){
  if(S.qIdx<S.pool.length-1){ S.qIdx++; S.sel=[]; S.answered=false; render(); window.scrollTo(0,0); }
  else endQuiz();
}
function vQuizRun(){
  const e=exNow(), q=S.pool[S.qIdx], multi=isMulti(q), cor=corSet(q);
  const L=['A','B','C','D','E','F'];
  const opts=q.a.map((t,i)=>{
    let c='opt';
    if(!S.answered && S.sel.indexOf(i)>=0) c+=' sel';
    if(S.answered){ c+=' locked';
      if(cor.indexOf(i)>=0) c+=' right'; else if(S.sel.indexOf(i)>=0) c+=' wrong'; }
    return '<button class="'+c+'" onclick="pickOpt('+i+')"><span class="mk">'+L[i]+'</span><span>'+t+'</span></button>';
  }).join('');
  const ok=S.answered && sameSet(S.sel,cor);
  let tail='';
  if(S.answered){
    tail='<div class="explain"><div class="verdict '+(ok?'v-ok':'v-no')+'">'
      +(ok?'&#10003; Correct':'&#10007; Not this time &mdash; which is exactly when the explanation sticks')
      +'</div>'+q.explain+'</div>'
      +'<div class="navrow"><span class="spacer"></span><button class="btn" onclick="nextQ()">'
      +(S.qIdx<S.pool.length-1?'Next &rarr;':'Finish')+'</button></div>';
  } else if(multi){
    tail='<div class="navrow"><span class="spacer"></span><button class="btn" onclick="checkAns()"'+(S.sel.length?'':' disabled')+'>Check answer</button></div>';
  }
  const mn=S.quizMode==='wrong'?'Reviewing mistakes':S.quizMode==='topic'?'Topic drill':'All questions';
  return '<div class="qbar"><span>'+e.code+' &middot; '+mn+'</span><span>Question '+(S.qIdx+1)+' of '+S.pool.length+'</span></div>'
   + '<div class="bar"><i style="width:'+pct(S.qIdx+(S.answered?1:0),S.pool.length)+'%"></i></div>'
   + '<div class="card" style="margin-top:16px">'
   + (q.official?'<span class="chip ac" style="margin-bottom:11px">OFFICIAL SAMPLE EXAM</span>':'')
   + (multi?'<span class="chip warn" style="margin-bottom:11px">SELECT ALL THAT APPLY</span>':'')
   + '<div class="qtext">'+q.q+'</div><div class="opts">'+opts+'</div>'+tail+'</div>'
   + '<div class="navrow"><button class="btn ghost sm" onclick="endQuiz()">Exit drill</button></div>';
}

/* ---- MOCK ---- */
function startMock(){
  const e=exNow(), c=e.mock;
  S.mock={ qs:shuffled(e.questions).slice(0,Math.min(c.count,e.questions.length)),
           idx:0, answers:{}, submitted:false, endsAt:Date.now()+c.minutes*60000 };
  S.view='mock'; render(); window.scrollTo(0,0);
}
function tick(){
  if(S.mockTimer) clearInterval(S.mockTimer);
  S.mockTimer=setInterval(function(){
    if(!S.mock||S.mock.submitted){ clearInterval(S.mockTimer); S.mockTimer=null; return; }
    const left=S.mock.endsAt-Date.now(), el=document.getElementById('mkT');
    if(el){ el.textContent=fmtTime(left);
      el.className='timer'+(left<60000?' crit':left<300000?' warn':''); }
    if(left<=0) submitMock(true);
  },500);
}
function mockPick(i){
  const m=S.mock, q=m.qs[m.idx], cur=m.answers[q.id]||[];
  if(isMulti(q)){ const at=cur.indexOf(i); if(at>=0)cur.splice(at,1); else cur.push(i); m.answers[q.id]=cur; }
  else m.answers[q.id]=[i];
  render();
}
function mockGo(i){ S.mock.idx=Math.max(0,Math.min(i,S.mock.qs.length-1)); render(); window.scrollTo(0,0); }
function submitMock(auto){
  const m=S.mock; if(!m||m.submitted) return;
  if(!auto){
    const un=m.qs.filter(q=>!(m.answers[q.id]||[]).length).length;
    if(un && !confirm(un+' question(s) unanswered. Submit anyway?')) return;
  }
  m.submitted=true;
  if(S.mockTimer){ clearInterval(S.mockTimer); S.mockTimer=null; }
  const e=exNow(), p=qp(); let right=0;
  m.qs.forEach(q=>{
    if(sameSet(m.answers[q.id]||[],corSet(q))){ right++; p.right[q.id]=(p.right[q.id]||0)+1; }
    else if((m.answers[q.id]||[]).length) p.wrong[q.id]=(p.wrong[q.id]||0)+1;
  });
  m.right=right; m.pct=pct(right,m.qs.length);
  m.passPct=Math.round(100*e.mock.passPoints/e.mock.totalPoints);
  m.passed=m.pct>=m.passPct;
  p.attempts.push({when:Date.now(),pct:m.pct,right:right,of:m.qs.length,passed:m.passed,exam:e.code});
  saveProg(); S.view='result'; render(); window.scrollTo(0,0);
}
function vMock(){
  const e=exNow(), m=S.mock; if(!m) return '<div class="empty">No mock running.</div>';
  setAccent(e.accent);
  const q=m.qs[m.idx], multi=isMulti(q), sel=m.answers[q.id]||[], L=['A','B','C','D','E','F'];
  const passPct=Math.round(100*e.mock.passPoints/e.mock.totalPoints);
  const opts=q.a.map((t,i)=>'<button class="opt'+(sel.indexOf(i)>=0?' sel':'')+'" onclick="mockPick('+i+')">'
    +'<span class="mk">'+L[i]+'</span><span>'+t+'</span></button>').join('');
  const sq=m.qs.map((qq,i)=>'<button class="sq'+((m.answers[qq.id]||[]).length?' done':'')+(i===m.idx?' cur':'')+'" onclick="mockGo('+i+')">'+(i+1)+'</button>').join('');
  return '<div class="qbar"><span><b>'+e.code+' mock</b> &middot; '+m.qs.length+' questions &middot; pass '+passPct+'%</span>'
   + '<span class="timer" id="mkT">'+fmtTime(m.endsAt-Date.now())+'</span></div>'
   + '<div class="card"><div class="qbar" style="margin-bottom:9px"><span>Question '+(m.idx+1)+' of '+m.qs.length+'</span>'
   + (multi?'<span class="chip warn">SELECT ALL THAT APPLY</span>':'')+'</div>'
   + (q.official?'<span class="chip ac" style="margin-bottom:11px">OFFICIAL SAMPLE EXAM</span>':'')
   + '<div class="qtext">'+q.q+'</div><div class="opts">'+opts+'</div>'
   + '<div class="navrow"><button class="btn ghost" onclick="mockGo('+(m.idx-1)+')"'+(m.idx===0?' disabled':'')+'>&larr; Previous</button>'
   + '<span class="spacer"></span><button class="btn ghost" onclick="mockGo('+(m.idx+1)+')"'+(m.idx===m.qs.length-1?' disabled':'')+'>Next &rarr;</button></div></div>'
   + '<div class="card tight"><h3>Summary screen</h3><p class="muted" style="font-size:.88em">Answer in any order, as in the real exam. Filled squares are answered.</p>'
   + '<div class="sumgrid">'+sq+'</div>'
   + '<div class="navrow"><button class="btn" onclick="submitMock(false)">End examination &amp; score</button></div></div>'
   + '<p class="fnote">'+MOCKNOTE[e.id]+'</p>';
}
function vResult(){
  const e=exNow(), m=S.mock; if(!m||!m.submitted) return '<div class="empty">No result.</div>';
  setAccent(e.accent);
  const by={};
  m.qs.forEach(q=>{ by[q.topic]=by[q.topic]||{n:0,ok:0}; by[q.topic].n++;
    if(sameSet(m.answers[q.id]||[],corSet(q))) by[q.topic].ok++; });
  const rows=e.topics.filter(t=>by[t.id]).map(t=>{ const b=by[t.id], p=pct(b.ok,b.n);
    return '<tr><td>'+esc(t.title.replace('★ ',''))+'</td><td>'+b.ok+' / '+b.n+'</td>'
      +'<td><span class="chip'+(p>=80?' good':p>=50?' warn':' bad')+'">'+p+'%</span></td></tr>'; }).join('');
  const weak=e.topics.filter(t=>by[t.id]&&pct(by[t.id].ok,by[t.id].n)<70);
  const missed=m.qs.filter(q=>!sameSet(m.answers[q.id]||[],corSet(q)));
  const L=['A','B','C','D','E','F'];
  const rev=missed.map(q=>'<div class="card tight" style="margin-bottom:11px">'
    +'<div style="font-weight:700;margin-bottom:7px">'+q.q+'</div>'
    +'<div class="muted" style="font-size:.88em">Your answer: <b>'+((m.answers[q.id]||[]).map(i=>L[i]).join(', ')||'&mdash;')
    +'</b> &middot; Correct: <b>'+corSet(q).map(i=>L[i]).join(', ')+'</b></div>'
    +'<div class="explain" style="margin-top:9px">'+q.explain+'</div></div>').join('');
  return '<div class="banner '+(m.passed?'good':'bad')+'"><div class="big">'+(m.passed?'Pass':'Not yet')+' &mdash; '+m.pct+'%</div>'
   + '<div>'+m.right+' of '+m.qs.length+' correct. Pass mark for '+e.code+' is <b>'+m.passPct+'%</b>.</div></div>'
   + '<h2>By topic</h2><div class="tbl-wrap"><table><tr><th>Topic</th><th>Score</th><th></th></tr>'+rows+'</table></div>'
   + (weak.length?'<div class="card tight"><h3>Where to go next</h3><p class="muted">Below 70% in: <b>'
      +weak.map(t=>esc(t.title.replace('★ ',''))).join(', ')+'</b>. Drill those topics, then re-sit.</p></div>'
      :'<div class="card tight"><h3>Solid across the board</h3><p class="muted">No topic under 70%. Re-sit in a few days to confirm it holds.</p></div>')
   + (missed.length?'<h2>Every question you missed</h2>'+rev:'')
   + '<div class="navrow"><button class="btn" onclick="startMock()">Sit another</button>'
   + '<button class="btn ghost" onclick="go(\'quiz\')">Back to '+e.code+'</button></div>';
}

/* ---- PROGRESS ---- */
function vProgress(){
  const rc=readCount(), tot=ALLMODS.length;
  const catRows=LIB.cats.map(c=>{ const d=c.m.filter(m=>isRead(m.id)).length, p=catPct(c);
    return '<tr><td>'+c.e+' '+esc(c.t)+'</td><td>'+d+' / '+c.m.length+'</td>'
      +'<td><span class="chip'+(p===100?' good':p>0?' warn':'')+'">'+p+'%</span></td></tr>'; }).join('');
  const qRows=Object.keys(EXAMS).map(k=>{ const e=EXAMS[k], pr=S.prog.quiz[k];
    const r=e.questions.filter(q=>pr.right[q.id]).length;
    const w=e.questions.filter(q=>pr.wrong[q.id]&&!pr.right[q.id]).length;
    const best=pr.attempts.length?Math.max.apply(null,pr.attempts.map(a=>a.pct))+'%':'&mdash;';
    return '<tr><td>'+e.code+'</td><td>'+r+' / '+e.questions.length+'</td><td>'+(w||'&mdash;')+'</td>'
      +'<td>'+pr.attempts.length+'</td><td>'+best+'</td></tr>'; }).join('');
  const all=[]; Object.keys(EXAMS).forEach(k=>S.prog.quiz[k].attempts.forEach(a=>all.push(a)));
  all.sort((a,b)=>b.when-a.when);
  const att=all.slice(0,15).map(a=>'<tr><td>'+new Date(a.when).toLocaleString()+'</td><td>'+(a.exam||'')+'</td>'
    +'<td>'+a.right+' / '+a.of+'</td><td>'+a.pct+'%</td>'
    +'<td><span class="chip'+(a.passed?' good':' bad')+'">'+(a.passed?'Pass':'Fail')+'</span></td></tr>').join('');
  const pathRows=PATHS.map(p=>{ const d=p.mods.filter(m=>isRead(m.id)).length;
    return '<tr><td>'+esc(p.t)+'</td><td>'+d+' / '+p.mods.length+'</td>'
      +'<td><span class="chip'+(d===p.mods.length?' good':d?' warn':'')+'">'+pct(d,p.mods.length)+'%</span></td></tr>'; }).join('');
  return '<h1 class="display">Progress</h1>'
   + '<div class="grid g4" style="margin:20px 0">'
   + '<div class="stat"><div class="n">'+rc+'</div><div class="l">modules read</div></div>'
   + '<div class="stat"><div class="n">'+pct(rc,tot)+'%</div><div class="l">library complete</div></div>'
   + '<div class="stat"><div class="n">'+quizRight()+'</div><div class="l">questions correct</div></div>'
   + '<div class="stat"><div class="n">'+all.length+'</div><div class="l">mock attempts</div></div></div>'
   + '<div class="bar"><i style="width:'+pct(rc,tot)+'%"></i></div>'
   + '<h2>By subject</h2><div class="tbl-wrap"><table><tr><th>Subject</th><th>Read</th><th></th></tr>'+catRows+'</table></div>'
   + '<h2>Learning paths</h2><div class="tbl-wrap"><table><tr><th>Path</th><th>Done</th><th></th></tr>'+pathRows+'</table></div>'
   + '<h2>Certification quiz</h2><div class="tbl-wrap"><table>'
   + '<tr><th>Exam</th><th>Correct</th><th>Still wrong</th><th>Mocks</th><th>Best</th></tr>'+qRows+'</table></div>'
   + (att?'<h2>Recent mock attempts</h2><div class="tbl-wrap"><table><tr><th>When</th><th>Exam</th><th>Score</th><th>%</th><th></th></tr>'+att+'</table></div>':'')
   + '<div class="navrow"><button class="btn danger" onclick="resetAll()">Reset all progress</button></div>';
}
function resetAll(){
  if(!confirm('Reset ALL progress — modules read, quiz results and mock history? This cannot be undone.')) return;
  S.prog=emptyProg(); saveProg(); render();
}

/* ---- boot ---- */
document.body.className='fs-'+S.font;
setAccent(null);
render();

</script>
</body>
