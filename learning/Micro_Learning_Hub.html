      { id:'s9-4', title:'Probing, listing and reaction forces', body:'How you extract the specific number the exam is asking for.',
        key:['<b>Probe</b> reports the value at a picked node, face or edge — this is how you answer "stress at point A"','<b>List Selected</b> gives values, and averages, over selected entities','<b>Reaction force</b> at a fixture is the check that the model is in equilibrium','The sum of reaction forces should equal the applied load, in the opposite sense — if it does not, something is wrong with the setup','Section clipping and iso clipping let you find a maximum that is buried inside the body'],
        hook:{label:'The 30-second validation', text:'List the reaction forces. If ΣF does not match the applied load, stop — do not report the stress.'} },
      { id:'s9-5', title:'Node values vs element values', body:'A subtle setting that changes the number you report.',
        key:['Stress is computed at <b>Gauss points</b> inside each element','<b>Node values</b> average the contributions of all elements meeting at a node — smoother, and the default','<b>Element values</b> report a single value per element — discontinuous between elements','The <b>difference between them is a mesh quality indicator</b>: a large jump means the mesh is too coarse there','Node values will report a slightly lower peak than element values at a stress concentration']
      }
    ],
    t10: [
      { id:'s10-1', title:'Stress singularities', body:'The single most important idea for judging whether a result is real, and a favourite of examiners.',
        key:['At a <b>sharp re-entrant corner</b> the theoretical stress is infinite. Refining the mesh makes the reported stress <b>rise without limit</b>','The stress there is a property of the <b>idealisation</b>, not of the part','Also occurs at <b>point loads</b> and at the edges of <b>fixed geometry</b> restraints','Fixes: model the real <b>fillet</b>; apply the load over an area; move the restraint away from the region of interest','If you cannot remove it, use <b>St. Venant\'s principle</b> — read the stress a characteristic dimension away'],
        trap:'The test for a singularity is refinement behaviour, not magnitude. <b>If refining the mesh keeps increasing the peak stress, it is a singularity.</b> If the peak settles to a value, it is a genuine stress concentration.' },
      { id:'s10-2', title:'Mesh convergence', body:'How you demonstrate a result is trustworthy, and the two adaptive methods SOLIDWORKS offers.',
        key:['Run the study at progressively finer mesh, plot the quantity of interest, and look for it to <b>flatten</b>','A change under roughly 5% between refinements is normally taken as converged','<b>h-adaptive</b> — the solver automatically <b>refines the mesh</b> where the error is high','<b>p-adaptive</b> — the solver increases the <b>polynomial order</b> of the elements instead','Both are available for <b>linear static studies with solid meshes</b>','Displacement converges first, stress later, stress at a concentration later still'],
        hook:{label:'h vs p', text:'<b>h</b> makes elements <b>smaller</b>. <b>p</b> makes them <b>smarter</b>.'} },
      { id:'s10-3', title:'Solvers', body:'The exam lists "selecting different solvers as directed to optimize problems".',
        key:['<b>FFEPlus</b> — iterative; scales well and uses less memory on <b>large</b> models','<b>Direct Sparse</b> — direct; robust, better for smaller models and for problems with very different material stiffnesses','<b>Large Problem Direct Sparse</b> — a direct solver for models too big for memory','<b>Intel Direct Sparse</b> — a faster direct solver making use of available cores/memory','<b>Automatic</b> lets Simulation choose','Solver choice changes speed and memory, <b>not</b> the correct answer'],
        trap:'If two solvers give materially different answers, the problem is the model — usually an ill-conditioned stiffness matrix from near-rigid-body motion or wildly mismatched stiffnesses — not the solver.' },
      { id:'s10-4', title:'Deciding whether a result is valid', body:'"Determining if results are valid and make sense" is an examinable objective in its own right.',
        key:['<b>Check equilibrium</b> — reaction forces must balance the applied load','<b>Check the deformed shape</b> at scale 1 — does it move the way physics says it should?','<b>Check the order of magnitude</b> against a hand calculation: σ = F/A, σ = Mc/I, δ = FL³/3EI','<b>Check the peak location</b> — is it at a fillet (plausible) or at a sharp corner or a restraint edge (suspect)?','<b>Check the assumptions</b> — is the displacement small, is the stress below yield, is it stable?'],
        hook:{label:'The habit that separates engineers', text:'Never report a simulation number you have not bounded with a hand calculation to within an order of magnitude.'} }
    ]
  },
  questions: [
    { id:'sq1', topic:'t2', q:'Which of the following are assumptions of linear static analysis? (Select all that apply.)', a:['Stress is proportional to strain throughout','Displacements are small enough not to change the stiffness','Loads are applied slowly, so inertia can be neglected','Boundary conditions remain constant during loading'], correct:[0,1,2,3], multi:true, explain:'All four define linear static analysis. The moment any one of them is violated — yielding, large deflection, impact, changing contact — a linear static result stops describing reality.' },
    { id:'sq2', topic:'t2', q:'A linear static study reports a peak von Mises stress of 900 MPa in a steel with a yield strength of 250 MPa. What does this tell you?', a:['The part will experience 900 MPa in service','The linear model has been pushed past its validity; the material would have yielded and redistributed the stress','The material data is wrong','The mesh is too fine'], correct:1, explain:'A linear model has no yielding — it extrapolates elastic behaviour indefinitely. The real part would yield and redistribute load. The useful output here is that FOS &lt; 1, not the number 900.' },
    { id:'sq3', topic:'t2', q:'In [K]{u} = {F}, what does the solver compute first?', a:['Stress','Strain','Displacement','Factor of safety'], correct:2, explain:'Displacements are solved first; strain is derived from the displacement gradient, and stress from strain. That is exactly why displacement is more accurate than stress on the same mesh.' },
    { id:'sq4', topic:'t2', q:'Which study type is required to assess a slender column that may collapse under axial compression?', a:['Linear static','Buckling','Thermal','Fatigue'], correct:1, explain:'A static study can report a perfectly comfortable stress for a column that is nowhere near stable. <b>Stress is not stability</b> — buckling needs a buckling study.' },
    { id:'sq5', topic:'t3', q:'How many degrees of freedom does each node of a solid tetrahedral element have?', a:['3 — three translations','6 — three translations and three rotations','2 — in-plane translations','1 — axial displacement'], correct:0, explain:'Solid elements have translational DOF only. This is why a moment cannot be applied directly to a node of a solid mesh, and why "fixed geometry" on a solid removes three DOF, not six.' },
    { id:'sq6', topic:'t3', q:'How many nodes does a high-quality (second-order) tetrahedral element have?', a:['4','8','10','20'], correct:2, explain:'Ten: four corner nodes plus six mid-side nodes. The mid-side nodes let the edges curve to follow geometry and let strain vary linearly within the element.' },
    { id:'sq7', topic:'t3', q:'How many nodes does a draft-quality tetrahedral element have?', a:['3','4','6','10'], correct:1, explain:'Four corner nodes, straight edges, constant strain. Fast to solve and poor at bending — use it to check a setup, never to produce an answer.' },
    { id:'sq8', topic:'t3', q:'How many degrees of freedom does each node of a shell element have?', a:['3','4','6','12'], correct:2, explain:'Six — three translations and three rotations. This is why shells can carry moments applied at nodes and solids cannot.' },
    { id:'sq9', topic:'t3', q:'A sheet metal part is added to a static study. What element type is used by default?', a:['Solid tetrahedral','Shell','Beam','Truss'], correct:1, explain:'Sheet metal is meshed with shell elements on the mid-surface. That is both faster and more accurate than trying to push several solid elements through a thin wall.' },
    { id:'sq10', topic:'t3', q:'Which element type carries axial load only, with no bending or moment capacity?', a:['Beam','Truss','Shell','Solid'], correct:1, explain:'A truss element is pin-jointed: 3 DOF per node, axial force only. A beam element has 6 DOF per node and carries shear and bending as well.' },
    { id:'sq11', topic:'t3', q:'Two solid bodies in a multibody part touch but no contact condition has been defined and global contact has been set to "allow penetration". What happens?', a:['They behave as one continuous solid','They pass through each other and, if unrestrained, cause a rigid body motion failure','The solver bonds them automatically','The study will not mesh'], correct:1, explain:'Bodies interact only through the contact conditions you define. With penetration allowed and no other restraint, an unrestrained body has nothing holding it — the classic instability error.' },
    { id:'sq12', topic:'t4', q:'What is the aspect ratio of a perfect tetrahedral element?', a:['0','1','10','It has no aspect ratio'], correct:1, explain:'1.0 for an ideal element. The ratio grows as the element becomes elongated or flattened, and the aspect ratio plot is the fastest way to find a degenerate region.' },
    { id:'sq13', topic:'t4', q:'What does the Jacobian check assess?', a:['Whether the mesh is fine enough for convergence','The distortion of mid-side nodes in second-order elements','The total number of elements in the model','Whether contact surfaces are correctly paired'], correct:1, explain:'Jacobian applies to high-quality elements: it checks whether the curved edges created by the mid-side nodes have distorted past legality. A negative Jacobian means the element is inverted.' },
    { id:'sq14', topic:'t4', q:'Which mesher automatically places smaller elements in regions of high curvature?', a:['Standard mesher','Curvature-based mesher','Draft mesher','Beam mesher'], correct:1, explain:'The curvature-based mesher sizes elements from local curvature. The blended curvature-based mesher is more robust still, and is the usual next step when a mesh fails.' },
    { id:'sq15', topic:'t4', q:'What is the purpose of applying mesh control to a fillet?', a:['To reduce total solve time','To place smaller elements where the stress gradient is steep, so the concentration is resolved','To bond the fillet to the adjacent face','To exclude the fillet from the analysis'], correct:1, explain:'Global refinement is expensive and mostly wasted. Mesh control spends elements where the gradient is steep — you want at least two or three second-order elements through the fillet.' },
    { id:'sq16', topic:'t5', q:'Which material properties are strictly required to run a linear static study? (Select all that apply.)', a:['Elastic modulus','Poisson\'s ratio','Yield strength','Thermal conductivity'], correct:[0,1], multi:true, explain:'E and ν define the elastic stiffness and are required. Yield strength is needed only for a <b>factor of safety</b> plot; thermal conductivity belongs to thermal studies.' },
    { id:'sq17', topic:'t5', q:'A study solves successfully but will not produce a factor of safety plot. What is the most likely cause?', a:['The mesh is too coarse','The material has no yield strength defined','The solver is set to FFEPlus','No fixtures were applied'], correct:1, explain:'The stress solve needs only E and ν, so it completes. FOS = yield ÷ von Mises, so without a yield strength the plot cannot be produced. It is a material definition problem.' },
    { id:'sq18', topic:'t5', q:'A stress plot legend reads 2.5e+08 N/m². What is this in MPa?', a:['2.5 MPa','25 MPa','250 MPa','2,500 MPa'], correct:2, explain:'1 MPa = 1 N/mm² = 10⁶ N/m². So 2.5×10⁸ N/m² = 250 MPa — a very typical steel yield strength, which is the sanity check that tells you the number is plausible.' },
    { id:'sq19', topic:'t5', q:'A custom material is entered with a yield strength of "250" into a field whose units are N/m². What has been created?', a:['A material yielding at 250 MPa','A material yielding at 250 Pa — effectively no strength at all','A material yielding at 250 N/mm²','An invalid material that will not solve'], correct:1, explain:'250 N/m² is 250 pascals. The study will solve happily and report a factor of safety near zero everywhere. Always check the units in the material dialogue.' },
    { id:'sq20', topic:'t6', q:'"Fixed geometry" applied to a face of a solid body removes how many degrees of freedom at each node?', a:['3 — the translations','6 — translations and rotations','1 — the normal translation','2 — the in-plane translations'], correct:0, explain:'Solid nodes have only three translational DOF, so that is all there is to remove. On a <b>shell</b>, the same fixture removes six, because shell nodes have rotations as well.' },
    { id:'sq21', topic:'t6', q:'What does a roller/slider fixture allow?', a:['Rotation about the face normal only','Movement within the plane of the face, but not normal to it','Movement normal to the face, but not within it','No movement at all'], correct:1, explain:'It restrains the normal translation and leaves in-plane motion free — the model of a surface resting on a frictionless support.' },
    { id:'sq22', topic:'t6', q:'A study fails with an instability error and displacements of the order of 10⁹ mm. What is the most likely cause?', a:['The mesh is too fine','The model is under-restrained — rigid body motion','The material yield strength is too low','Too many contact sets are defined'], correct:1, explain:'Absurd displacements and a singular stiffness matrix mean an unrestrained rigid body motion. Enabling soft springs is a <b>diagnostic</b>; the fix is a correct restraint.' },
    { id:'sq23', topic:'t6', q:'Which fixture is used on the cut faces of a half model to represent the missing half?', a:['Fixed hinge','Symmetry','Elastic support','Bearing fixture'], correct:1, explain:'Symmetry restrains translation normal to the cut face and the in-plane rotations. It halves the model cost and removes rigid body motion at the same time.' },
    { id:'sq24', topic:'t7', q:'A 900 N force is applied to a selection of three faces with the "total" option. What force does each face carry?', a:['900 N each','300 N each','2,700 N total','It cannot be determined'], correct:1, explain:'"Total" distributes the value across the selection — 300 N per face. Selecting "per item" would apply 900 N to each, for 2,700 N total. Misreading this is a factor-of-three error.' },
    { id:'sq25', topic:'t7', q:'Which load correctly represents a shaft pressing into a hole?', a:['Uniform pressure on the full cylindrical face','Bearing load','Force on the face','Torque about the axis'], correct:1, explain:'A bearing load applies a cosine-distributed pressure over roughly half the bore, because a shaft pushes and cannot pull. Uniform pressure on the full bore is physically wrong and gives a different peak stress.' },
    { id:'sq26', topic:'t7', q:'Which loads require the material mass density to be defined? (Select all that apply.)', a:['Gravity','Centrifugal','Pressure','Remote mass'], correct:[0,1,3], multi:true, explain:'Anything whose magnitude derives from mass needs density. A pressure load is specified directly as force per unit area and does not.' },
    { id:'sq27', topic:'t7', q:'What is the advantage of a remote load over an equivalent force applied directly to the face?', a:['It solves faster','It applies the load at an offset point, so the resulting moment is correctly represented','It automatically refines the mesh','It does not require a fixture'], correct:1, explain:'A force acting 200 mm away from a face produces a moment that the same force applied on the face does not. The moment is usually what breaks the part.' },
    { id:'sq28', topic:'t8', q:'What is the default global contact condition between touching components?', a:['No penetration','Bonded','Allow penetration','Shrink fit'], correct:1, explain:'Bonded is the default — touching faces behave as if glued. It is linear and fast, and it is wrong for any joint that should be able to separate or slide.' },
    { id:'sq29', topic:'t8', q:'Which contact type makes the analysis non-linear and therefore slower to solve?', a:['Bonded','No penetration','Allow penetration','Free'], correct:1, explain:'No penetration requires the solver to iterate to find which areas are in contact at the converged solution — the contact area is part of the answer, which is what makes it non-linear.' },
    { id:'sq30', topic:'t8', q:'A contact set is defined on two faces that also fall under a global bonded condition. Which applies?', a:['The global condition','The contact set','Both are averaged','The study fails with a conflict error'], correct:1, explain:'The hierarchy is global → component → contact set, with the most specific winning. This is why checking the contact folder before solving is part of the setup.' },
    { id:'sq31', topic:'t8', q:'Why is a bolt connector preferred over modelling the bolt geometry?', a:['Bolt geometry cannot be meshed','It captures preload and the load path without thousands of elements and a thread-root singularity','It automatically applies the correct material','It is required by the exam'], correct:1, explain:'Meshing threads is expensive and produces a singularity at the root. The connector supplies the stiffness and preload for negligible cost.' },
    { id:'sq32', topic:'t8', q:'A pin connector is defined between two cylindrical faces "with retaining ring". What does this add?', a:['Rotational restraint about the pin axis','Restraint of relative axial translation','Radial stiffness','A preload force'], correct:1, explain:'The retaining ring option prevents the two faces sliding apart along the axis. The separate "with key" option is what restrains relative <b>rotation</b>.' },
    { id:'sq33', topic:'t9', q:'Von Mises stress is most appropriate for which class of material?', a:['Brittle','Ductile','Composite','Elastomeric'], correct:1, explain:'Von Mises is the distortion-energy criterion for ductile materials. Brittle materials need maximum normal stress or Mohr-Coulomb, which are sensitive to the sign of the stress.' },
    { id:'sq34', topic:'t9', q:'Why can a von Mises plot not distinguish tension from compression?', a:['Because the mesh averages the values','Because it is an equivalent scalar and is always positive','Because SOLIDWORKS displays absolute values by default','Because the solver discards the sign'], correct:1, explain:'It combines the stress tensor into a single positive equivalent value. Where you need the sign — brittle materials, crack concerns, contact — use the principal stresses P1 and P3.' },
    { id:'sq35', topic:'t9', q:'A location shows a factor of safety of 0.8. What does this mean?', a:['The part is safe with 20% margin','The von Mises stress exceeds the yield strength at that location','The mesh has not converged','The material density is wrong'], correct:1, explain:'FOS = yield ÷ von Mises, so FOS &lt; 1 means the criterion is violated there. Whether that matters depends on whether the location is a genuine concentration or a singularity.' },
    { id:'sq36', topic:'t9', q:'What does URES represent in a displacement plot?', a:['Displacement in the X direction','The resultant displacement magnitude','The residual error of the solution','Displacement of the restrained nodes'], correct:1, explain:'URES is the magnitude of the displacement vector. UX, UY and UZ are the components in the selected coordinate system.' },
    { id:'sq37', topic:'t9', q:'A deformed-shape plot appears to show a bracket bent double. What should you check first?', a:['The material yield strength','The deformation scale factor','The number of elements','The contact definitions'], correct:1, explain:'The default deformation scale is automatic and can be hundreds to one. Set it to 1 before judging plausibility — the part may have moved 0.2 mm.' },
    { id:'sq38', topic:'t9', q:'What is the fastest check that a static study is correctly set up?', a:['Refine the mesh and re-run','List the reaction forces and confirm they balance the applied load','Change the solver','Switch to element values'], correct:1, explain:'Equilibrium is non-negotiable: ΣF at the fixtures must equal the applied load in the opposite sense. If it does not, do not report the stress.' },
    { id:'sq39', topic:'t9', q:'A large difference between node values and element values in a region indicates:', a:['A solver error','A mesh that is too coarse in that region','An incorrect material','A missing fixture'], correct:1, explain:'Node values are averaged across elements meeting at a node; element values are not. A large discontinuity between adjacent elements is a direct signal that the mesh cannot resolve the gradient.' },
    { id:'sq40', topic:'t10', q:'Refining the mesh at a sharp internal corner causes the reported peak stress to keep increasing with every refinement. What is happening?', a:['The mesh is converging correctly','It is a stress singularity — the theoretical stress there is infinite','The material model is wrong','The solver has become unstable'], correct:1, explain:'This refinement behaviour <b>is</b> the definition of a singularity. Model the real fillet, or read the stress a characteristic distance away using St. Venant\'s principle.' },
    { id:'sq41', topic:'t10', q:'Which of these produce stress singularities? (Select all that apply.)', a:['A sharp re-entrant corner with no fillet','A point load applied to a vertex','The edge of a fixed-geometry restraint','A generously filleted shoulder'], correct:[0,1,2], multi:true, explain:'All idealisations that concentrate load or restraint into zero area produce singularities. A real fillet gives a genuine stress <b>concentration</b>, which converges to a finite value.' },
    { id:'sq42', topic:'t10', q:'What is the difference between h-adaptive and p-adaptive methods?', a:['h refines the mesh; p increases the polynomial order of the elements','h is for solids; p is for shells','h is iterative; p is direct','There is no difference'], correct:0, explain:'<b>h makes elements smaller; p makes them smarter.</b> Both are available for linear static studies with solid meshes and both aim at a converged, mesh-independent result.' },
    { id:'sq43', topic:'t10', q:'Which solver is generally most suitable for very large models with limited memory?', a:['Direct Sparse','FFEPlus','Large Problem Direct Sparse','It makes no difference'], correct:1, explain:'FFEPlus is iterative and scales well in memory on large problems. Solver choice affects speed and memory, not the correct answer — if two solvers disagree materially, the model is ill-conditioned.' },
    { id:'sq44', topic:'t10', q:'A study has converged in displacement but the peak stress is still rising with refinement, and the peak sits at a filleted shoulder. What is the correct interpretation?', a:['It is a singularity; ignore the stress','The stress has not yet converged; refine further at the fillet and re-check','The material is wrong','The load is too high'], correct:1, explain:'A fillet is a genuine concentration and must converge to a finite value. Displacement converges first, stress later, and stress at a concentration later still — so refine locally and confirm it flattens.' },
    { id:'sq45', topic:'t1', q:'How should the 120 minutes best be allocated across a 100-point paper?', a:['Work strictly front to back','Bank the low-point theory questions first, then take the hands-on problems in descending point order','Do the hands-on problems first, then theory','Spend equal time on every question'], correct:1, explain:'Points per minute is the only metric. Theory questions are cheap and quick; the 15–20 point hands-on problems deserve proportionate time — roughly 1.2 minutes per point.' },
    { id:'sq46', topic:'t1', q:'Which statements about SOLIDWORKS certification exams are true? (Select all that apply.)', a:['Exams cannot be paused once started','The TesterPRO client can resume after a computer crash','The exam timer pauses during a crash','A dual-monitor setup is recommended'], correct:[0,1,3], multi:true, explain:'The client is designed to resume after a crash, but the clock keeps running throughout — which is exactly why a stable machine and a dual-monitor setup matter.' },
    { id:'sq47', topic:'t5', q:'What is the purpose of defining a local coordinate system in a study?', a:['To speed up the solve','To apply loads or restraints, and read results, along a direction that is not aligned with the global axes','To change the units of the study','To define the mesh density'], correct:1, explain:'Loads, fixtures and result plots can all reference a local system. It is essential whenever you need a component of stress or displacement along a non-global direction.' },
    { id:'sq48', topic:'t4', q:'How many second-order elements should ideally sit through a fillet to resolve its stress concentration?', a:['One','At least two, preferably three','Ten or more','It does not matter with high-quality elements'], correct:1, explain:'Two to three second-order elements through the fillet is the practical rule. One element cannot represent the curvature of the stress field, however high its order.' }
  ]
};

/* ============================ CSWP ============================ */
EXAMS.p = {
  id: 'p', code: 'CSWP', name: 'Design Professional',
  accent: '#A89BC9', accent2: '#C0B5DC',
  tagline: 'Three independent segments. Includes the official Segment 1 sample exam, with the real answer key.',
  spec: {
    'Structure': 'Three separately purchased, separately scored segments — any order, any time',
    'Segment 1': 'Part from a drawing — 70 min, 75 of 105 points to pass',
    'Segment 2': 'Configurations & design tables — 50 min, 77 of 104 points to pass',
    'Segment 3': 'Assembly modeling — 80 min, 77 of 109 points to pass',
    'Total length': '3 hours 20 minutes across all three',
    'Passing a segment': 'Once passed it never needs retaking; fail one and only that one is repurchased',
    'Software needed': 'SOLIDWORKS 2015 or later, plus Excel for design tables',
    'Retake': '14-day wait per segment, new credit each attempt',
    'Prerequisite': 'None (K–12 academic candidates must hold CSWA first)',
    'Award': 'CSWP is granted automatically once all three segments are passed'
  },
  mock: { count: 24, minutes: 70, passPoints: 75, totalPoints: 105 },
  topics: [
    { id:'t1', title:'Segment 1 · Equations & Linked Dimensions', blurb:'The technique the whole segment is built on' },
    { id:'t2', title:'Segment 1 · Modify & Re-measure',           blurb:'Changing parameters without losing design intent' },
    { id:'t3', title:'Segment 2 · Configurations',                blurb:'Deriving, switching, and what carries over' },
    { id:'t4', title:'Segment 2 · Design Tables',                 blurb:'Excel-driven configurations and their syntax' },
    { id:'t5', title:'Segment 3 · Assemblies & Mates',            blurb:'Standard, advanced and mechanical mates' },
    { id:'t6', title:'Segment 3 · Motion, Collision, Interference',blurb:'The three checks the exam always asks for' },
    { id:'t7', title:'Segment 3 · Coordinate Systems & Mass',      blurb:'Mass properties about a custom origin' },
    { id:'t8', title:'Exam Mechanics & Strategy',                 blurb:'TesterPRO, units, decimals, time budgeting' },
    { id:'t9', title:'★ Official Sample Exam — Segment 1',        blurb:'The five real published questions and answer key' }
  ],
  cards: {
    t1: [
      { id:'p1-1', title:'What Segment 1 actually tests', body:'You are given a drawing with dimensions labelled A, B, C, D, E and a set of equations such as X = A/3. You build the part, report its mass, and are then asked to change the parameters — repeatedly — and report the mass again each time.',
        key:['The modelling is not hard. <b>The re-modelling is the exam</b>','If your model rebuilds cleanly when five dimensions change at once, you pass. If it breaks, you run out of time','70 minutes, 105 points, 75 to pass — you can lose one whole question and still pass','Answers are usually multiple choice for the first question of a stage, then <b>fill-in-the-blank</b> for the updates'],
        hook:{label:'The real skill', text:'This is a <b>parametric robustness</b> exam wearing a modelling exam\'s clothes.'} },
      { id:'p1-2', title:'Linked values (shared values)', body:'The official hint list puts this first, and it is the single highest-value technique in the segment.',
        key:['Right-click a dimension → <b>Link Values</b> and give it a name; every dimension sharing that name updates together','Officially also called <b>shared values</b>','Use it wherever the drawing shows the same letter twice — that is the exam telling you the dimensions are linked','Change the value once and every linked instance follows','Managed in the equations dialogue under <b>Global Variables</b>'],
        trap:'If you type the same number into two dimensions instead of linking them, the model looks identical and rebuilds identically — until the update question, where you must remember to change both. That is exactly how people lose Segment 1.' },
      { id:'p1-3', title:'Equations and global variables', body:'The exam gives you equations directly (X = A/3, Y = B/3 + 10 mm). Enter them as equations, never as arithmetic you did in your head.',
        key:['Open <b>Tools → Equations</b>; define global variables A, B, C, D, E first, then driven dimensions','Reference a dimension by its name in double quotes: <span class="mono">"D1@Sketch1" = "A" / 3</span>','Global variables can carry units; be consistent with the document units','Equations are evaluated in order, and the dialogue flags a circular reference','<b>Automatic rebuild</b> should be on so a parameter change propagates immediately'],
        hook:{label:'Why it matters', text:'When the exam changes A from 213 to 225, one edit updates every dependent dimension. Without equations you are hand-editing a dozen numbers under time pressure.'} },
      { id:'p1-4', title:'Renaming dimensions — the official hint', body:'Hint 2 in the official sample exam: change the label of the dimensions in your part to A, B, C, D so you can see at a glance which ones the exam is talking about.',
        key:['Select a dimension → in the PropertyManager, set its <b>Name</b> under Primary Value','Rename to exactly the letters the exam uses','It costs about a minute and removes essentially all risk of updating the wrong dimension','The official alternative (Hint 3) is to drive the whole thing from a <b>design table</b> instead'],
        trap:'Do the renaming <b>as you build</b>, not afterwards. Going back through a finished tree to find "which dimension was C" is exactly the time sink the hint exists to prevent.' },
      { id:'p1-5', title:'Building for change, not for looks', body:'Design intent is graded implicitly: a fragile model fails the update questions even if the first answer was right.',
        key:['Fully define every sketch. An under-defined sketch will move unpredictably when a driving dimension changes','Sketch relations beat dimensions for symmetry — use <b>symmetric, equal, collinear</b>','Avoid dimensioning to a fillet edge or to geometry that may disappear','Keep the tree shallow: fewer, more robust features rebuild more reliably','<b>Save a copy after each stage</b> — the official instructions recommend it, so you can recover a working model'],
        hook:{label:'The test', text:'Change A by 20 mm and rebuild. If anything goes red, fix it <b>now</b> — not in the exam.'} }
    ],
    t2: [
      { id:'p2-1', title:'Mass properties — the answer format', body:'Almost every Segment 1 question resolves to "what is the mass of the part". Getting the number right and getting it in the right form are two different problems.',
        key:['<b>Tools → Evaluate → Mass Properties</b>','Set the unit system the question demands — the sample exam uses <b>MMGS</b> (millimetre, gram, second)','Set <b>decimal places to 2</b>, as instructed','Assign the exact material named; the sample specifies Alloy Steel with density 0.0077 g/mm³','If your answer is not among the multiple-choice options, <b>the model is wrong</b> — that is the intended purpose of the options'],
        trap:'A density of 0.0077 g/mm³ is 7,700 kg/m³. If you set the units to IPS or leave the default material, the mass will be wrong by a clean factor — and the multiple choice will not save you on the fill-in-the-blank questions.' },
      { id:'p2-2', title:'The update questions', body:'Questions 2, 3 and 5 of the sample exam simply change the parameters and ask for the new mass. This is where the segment is won.',
        key:['Change only the labelled parameters; <b>everything else must stay as it was</b>','Rebuild and re-run Mass Properties','A well-built model takes about 60 seconds per update; a fragile one takes ten minutes or fails','Watch for an <b>equation that itself changes</b> — in the sample exam, Y goes from B/3 + 10 to B/3 + 15 at Stage 2','Do not rebuild the part from scratch for each stage'],
        hook:{label:'The whole segment in one line', text:'Build once, change five numbers, read the mass. Four times.'} },
      { id:'p2-3', title:'Stage 2 — the modify question', body:'Partway through, the exam gives you new images and asks you to modify the existing part into a more complex one, with changes concentrated in labelled areas.',
        key:['Changes are localised and the images circle them — the sample exam marks areas AA, BB and CC','You are modifying the <b>same part</b>, not starting a new one','This is why saving a copy at the end of Stage 1 matters: if the modification goes wrong you can recover','After modifying, the parameter-update questions start again against the new geometry','Check whether any <b>equation definitions</b> changed along with the geometry']
      }
    ],
    t3: [
      { id:'p3-1', title:'Configurations — the basics', body:'Segment 2 is 50 minutes on part variation. Configurations are how a single part file holds several versions of itself.',
        key:['Created in the <b>ConfigurationManager</b> tab','Each configuration can control dimension values, feature <b>suppression</b>, and some properties','<b>Derived configurations</b> inherit from a parent; changing the parent propagates to the child unless the child overrides it','Switching configuration triggers a rebuild — always confirm the active configuration before reading mass properties','Configuration-specific properties are what feed a BOM'],
        trap:'Mass properties are reported for the <b>active</b> configuration. Reading the mass with the wrong configuration active is the most common way to lose marks in Segment 2, and nothing on screen warns you.' },
      { id:'p3-2', title:'This configuration vs all configurations', body:'The dialogue every feature and dimension change offers, and the source of most configuration confusion.',
        key:['<b>This configuration</b> — the change applies only to the active one','<b>All configurations</b> — applies everywhere','<b>Specify configurations</b> — pick a subset','Dimensions changed for "this configuration" become configuration-specific and appear in the design table','Feature suppression is inherently configuration-specific'],
        hook:{label:'Habit', text:'Read that dialogue every single time. The default is not always what you want, and the mistake is invisible until you switch configuration.'} },
      { id:'p3-3', title:'Creating configurations from configurations', body:'An explicitly listed exam topic — deriving one configuration from another rather than from the default.',
        key:['Right-click an existing configuration → <b>Add Derived Configuration</b>','The derived configuration inherits everything not explicitly overridden','Useful for families: a base, then variants that differ in one or two features','Renaming and reordering is done in the ConfigurationManager','Deleting a parent affects its children — check before deleting']
      }
    ],
    t4: [
      { id:'p4-1', title:'Design tables', body:'An Excel-embedded table that generates and controls configurations. Excel must be installed on the exam machine — the official instructions say so explicitly.',
        key:['<b>Insert → Tables → Design Table</b>; auto-create populates from existing configurations','Each <b>row is a configuration</b>; each <b>column is a controlled parameter</b>','Cell A1 is reserved; configuration names go down column A from A3; parameter headers go across row 2','Edit in place — the spreadsheet opens inside the SOLIDWORKS window','Right-click the table → <b>Edit Table</b> to reopen it'],
        trap:'No Excel, no design table. The official exam guide lists Excel as a requirement for Segment 2, and discovering it is missing at the start of a 50-minute timed segment is unrecoverable.' },
      { id:'p4-2', title:'Design table syntax', body:'The column headers are a small formal language, and the exam expects fluency.',
        key:['<b>Dimension:</b> <span class="mono">D1@Sketch1</span> — the dimension name and its owning feature/sketch','<b>Suppression:</b> <span class="mono">$STATE@Fillet1</span> — values <span class="mono">S</span> (suppressed) or <span class="mono">U</span> (unsuppressed)','<b>Configuration comment:</b> <span class="mono">$COMMENT</span>','<b>User notes / properties:</b> <span class="mono">$PRP@Description</span>','Feature and dimension names must match the model <b>exactly</b>, including case'],
        hook:{label:'Fastest route', text:'Let SOLIDWORKS <b>auto-create</b> the table from configurations you have already made — it writes the syntax correctly, and you edit values rather than authoring headers.'} },
      { id:'p4-3', title:'Rearranging and modifying features', body:'The other half of Segment 2: "changing and/or rearranging features of an existing SOLIDWORKS part."',
        key:['Features can be <b>dragged</b> in the FeatureManager to change rebuild order','Reordering changes the result — a fillet before a shell is not the same part as a shell before a fillet','The <b>rollback bar</b> lets you insert a feature partway up the tree','Parent-child relationships restrict how far a feature can move; check <b>Parent/Child</b> before dragging','<b>Move/Delete Face</b> edits geometry directly and is an explicitly listed exam tool'],
        trap:'Reordering can silently change the mass. If a question asks you to reorder and then report mass, the whole point is that the number changes.' }
    ],
    t5: [
      { id:'p5-1', title:'Building the assembly', body:'Segment 3 is 80 minutes, the longest segment, and it starts by assembling parts that are supplied to you.',
        key:['You download the exam files through the testing client — have a known folder ready','The <b>first component inserted is fixed</b> by default; every later one is floating','Right-click → Float / Fix changes this. A fully fixed assembly cannot be moved for collision checks','<b>Insert Components</b> for existing parts; subassemblies are inserted the same way','A subassembly is <b>rigid</b> by default; make it <b>flexible</b> to allow its internal parts to move'],
        trap:'Rigid versus flexible subassembly is an explicitly listed exam topic. A rigid subassembly will not articulate, so a motion or collision question against it will give the wrong answer with no error message.' },
      { id:'p5-2', title:'Standard mates', body:'The everyday set, and the exam expects them to be second nature.',
        key:['<b>Coincident</b>, <b>Parallel</b>, <b>Perpendicular</b>, <b>Tangent</b>, <b>Concentric</b>','<b>Distance</b> and <b>Angle</b> — these take a value and can be flipped','Mate alignment (aligned / anti-aligned) flips the direction — a frequent cause of a part appearing inside out','Under-mated components still have degrees of freedom, which is exactly what you need for motion questions','Over-defining produces a mate error; the fix is usually to delete a redundant mate, not to add another'],
        hook:{label:'Count the DOF', text:'A component starts with 6 DOF. Each mate removes some. For a motion question you want <b>exactly one</b> left.'} },
      { id:'p5-3', title:'Advanced and mechanical mates', body:'These separate CSWP from CSWA, and Segment 3 lists advanced mates explicitly.',
        key:['<b>Advanced:</b> Width, Limit Distance, Limit Angle, Symmetric, Path, Linear/Linear Coupler','<b>Width</b> centres a tab in a slot — enormously useful and frequently examined','<b>Limit</b> mates define a range of travel, which is what makes a realistic motion study possible','<b>Mechanical:</b> Cam, Gear, Rack and Pinion, Screw, Hinge, Slot, Universal Joint','A <b>Gear</b> mate takes a ratio; a <b>Screw</b> mate couples rotation to translation'],
        trap:'Gear and cam mates are <b>kinematic constraints</b>, not physics. They enforce a ratio regardless of whether the teeth could actually mesh — so they will not detect an interference you have not asked about.' }
    ],
    t6: [
      { id:'p6-1', title:'Interference detection', body:'A static check: which components occupy the same space in the current position.',
        key:['<b>Tools → Evaluate → Interference Detection</b>','Reports each interference with its <b>volume</b> — the exam may ask for that number','Options include treating coincident faces as interference, and ignoring hidden or fastener components','It examines the assembly <b>as currently positioned</b>, not through a range of motion','Run it before answering any "do these parts fit" question'],
        hook:{label:'Static vs dynamic', text:'<b>Interference</b> asks "do they overlap now?" <b>Collision</b> asks "do they hit while moving?" The exam uses both words deliberately.'} },
      { id:'p6-2', title:'Collision detection', body:'A dynamic check performed while dragging a component — an explicitly listed Segment 3 topic.',
        key:['Available in <b>Move Component</b> → Collision Detection','Choose between checking <b>all components</b> or a selected subset','<b>Stop at collision</b> halts the drag at the contact point — this is how you find a limit of travel','<b>Physical Dynamics</b> lets the collided part be pushed along','Requires free degrees of freedom: a fully mated component cannot be dragged and cannot collide'],
        trap:'If nothing moves, the component is either fully mated or fixed. Check for the (f) prefix in the tree — a fixed component is the commonest reason a collision question appears to have no answer.' },
      { id:'p6-3', title:'Other evaluation tools', body:'The rest of the Evaluate toolbar that Segment 3 can call on.',
        key:['<b>Clearance Verification</b> — reports the minimum gap between selected components','<b>Hole Alignment</b> — finds holes that do not line up','<b>Measure</b> — distances, angles, arc lengths; the workhorse for any dimensional question','<b>Sensors</b> can watch a mass property or a dimension and alert on a threshold','<b>Assembly Visualization</b> sorts components by mass, cost or a custom property']
      }
    ],
    t7: [
      { id:'p7-1', title:'Creating a coordinate system', body:'Two of the listed Segment 3 topics are "creating a coordinate system" and "using a coordinate system to perform mass properties analysis". They always appear together.',
        key:['<b>Insert → Reference Geometry → Coordinate System</b>','Pick a vertex, point or origin for the origin; then define the X, Y and Z directions from edges or faces','The direction arrows can be flipped — an incorrect flip gives correct magnitudes with wrong signs','A coordinate system can be created in a part or in an assembly','Once created it appears in the mass properties dialogue as a reporting option'],
        hook:{label:'Why the exam loves it', text:'It proves you understand that mass properties are <b>frame-dependent</b> — mass is not, but centre of mass and moments of inertia certainly are.'} },
      { id:'p7-2', title:'Mass properties about a custom frame', body:'The final question of Segment 3 is very often exactly this.',
        key:['In <b>Mass Properties</b>, use the <b>Report coordinate values relative to</b> selector to choose your coordinate system','<b>Mass</b> and <b>volume</b> do not change with the frame','<b>Centre of mass</b> coordinates change with the frame','<b>Moments of inertia</b> change with both origin and orientation','Set units and decimal places before reading, exactly as in Segment 1'],
        trap:'Reporting the centre of mass in the <b>default</b> frame when the question asked for a custom coordinate system gives three plausible-looking numbers that are all wrong. Read the selector every time.' },
      { id:'p7-3', title:'Replacing a component', body:'"Replacing a part with another part in an assembly" is a listed topic, and it is a mate-management exercise.',
        key:['Right-click the component → <b>Replace Components</b>','Mate references and matching entity names help mates survive the swap','Any mate that cannot find its reference goes into the <b>Mate Entities</b> repair dialogue','Expect to re-pick a face or two; that is normal, not a failure','After replacing, <b>re-run interference detection</b> — the new part may be a different size']
      }
    ],
    t8: [
      { id:'p8-1', title:'Before you start the segment', body:'A checklist that costs five minutes and prevents most avoidable failures.',
        key:['<b>Excel installed and working</b> — required for Segment 2 design tables','A known download folder for exam files, and space on the drive','Dual monitors if possible: SOLIDWORKS on one, TesterPRO on the other','SOLIDWORKS 2015 or later, opened and warmed up <b>before</b> you start the clock','Close everything else — the exam cannot be paused and a crash costs clock time'],
        trap:'The exam timer starts when you click Start Examination and does not stop for anything: not a crash, not a reboot, not a power cut. The client can resume; the clock cannot.' },
      { id:'p8-2', title:'Units, decimals and answer format', body:'The most common source of a wrong answer on a correctly built model.',
        key:['The question states the unit system — the sample exam uses <b>MMGS</b> throughout','It states the decimal places — the sample exam uses <b>2</b>','Set <b>Document Properties → Units</b> to match before you model, not after','Apply the exact material named, and verify its density matches the value given','For fill-in-the-blank answers there is no multiple choice to catch you'],
        hook:{label:'The check that saves you', text:'On multiple-choice questions, if your answer is not one of the options, <b>the model is wrong</b>. That is what the options are for. Go back before you guess.'} },
      { id:'p8-3', title:'Time budgeting per segment', body:'Each segment is tight, and each is tight in a different way.',
        key:['<b>Segment 1 · 70 min</b> — roughly 25 min to build Stage 1, then ~5 min per update. Building slowly is fine; rebuilding slowly is fatal','<b>Segment 2 · 50 min</b> — the shortest. Know the design table syntax cold; there is no time to learn it','<b>Segment 3 · 80 min</b> — longest, but downloading and opening files eats the first 10 minutes','Segments can be taken on different days — <b>do not sit all three in one sitting</b> unless you have to','A failed segment costs only that segment: 14 days and one credit'],
        hook:{label:'Sequencing advice', text:'Many candidates find Segment 2 the easiest and Segment 1 the hardest. Sitting an easier segment first builds confidence and costs nothing, since order does not matter.'} }
    ],
    t9: [
      { id:'p9-1', title:'About this sample exam', body:'What follows is the <b>official CSWP practice exam published by Dassault Systèmes</b> on solidworks.com, reproduced with its own answer key. It is the closest thing to real exam content that exists in the public domain — the guide itself says it is "designed to give you a preview of the CSWP without disclosing the entirety of the test", drawn from Segment 1, which it calls <b>the hardest segment</b>.',
        key:['Five questions: one build, two parameter updates, one modify, one further update','Common setup for all five: <b>MMGS</b>, <b>2 decimal places</b>, arbitrary origin, <b>Alloy Steel</b> at <b>0.0077 g/mm³</b>, all holes through all unless shown otherwise','Questions 1 and 4 are multiple choice; questions 2, 3 and 5 are fill-in-the-blank — exactly the real pattern','<b>You need the drawings.</b> The dimension geometry lives in images in the official PDF, which is free to download','The parameter sets and the answer key below are complete and are reproduced exactly'],
        trap:'Do not attempt to reverse-engineer the geometry from the masses. Download the PDF, model from the images, and use these numbers to <b>check</b> yourself — that is what makes it a valid rehearsal.' },
      { id:'p9-2', title:'The equations that run through all five questions', body:'Every question in the sample exam uses the same two driven parameters, and one of them changes at Stage 2. That change is the point of the whole exercise.',
        key:['<b>X = A / 3</b> — in every question','<b>Y = B / 3 + 10 mm</b> — Stage 1 (questions 1, 2, 3)','<b>Y = B / 3 + 15 mm</b> — Stage 2 (questions 4, 5). The guide flags this explicitly: <i>"the equation for Y has changed from the initial part"</i>','Hole F is constant throughout: Hole Wizard, ANSI Metric Counterbore, Hex Bolt ANSI B18.2.3.5M, M8, Close fit, through hole Ø15.00, counterbore Ø30.00 × 10.00 deep, Through All'],
        hook:{label:'This is the trap in miniature', text:'A candidate who typed <span class="mono">B/3 + 10</span> as a number instead of an equation has to find and fix it under time pressure at Stage 2. A candidate who entered the equation changes one character.'} },
      { id:'p9-3', title:'The official hints, verbatim in substance', body:'Dassault publishes three hints with this exam. They are worth more than most third-party advice.',
        key:['<b>Hint 1:</b> use <b>linked dimensions (shared values)</b> to manage dimensions that must stay equal across stages','<b>Hint 2:</b> <b>rename your dimensions to A, B, C, D…</b> to keep visual track of which need changing','<b>Hint 3:</b> as an alternative to Hint 2, drive the changing parameters from a <b>design table</b>','The guide also advises <b>saving a version of the model after each question</b>, so you can recover and so you can fix earlier errors','And it states plainly that <b>no solutions will ever be shared by the certification team</b> — the answer key below is all there is'],
        trap:'The published disclaimer is blunt: being a professional-level certified user includes the ability to research SOLIDWORKS functionality yourself. Nobody will explain the method to you.' }
    ]
  },
  questions: [
    /* ---- t9 : the official sample exam, real questions and real answers ---- */
    { id:'pq1', topic:'t9', official:true, q:'<b>OFFICIAL SAMPLE — Q1 · Stage 1, Initial Part.</b><br>Build the part from the drawing. MMGS, 2 decimal places, arbitrary origin, Alloy Steel, density 0.0077 g/mm³, all holes through all unless shown otherwise.<br><br>A = 213 mm · B = 200 mm · C = 170 mm · D = 130 mm · E = 41 mm<br>X = A/3 · Y = B/3 + 10 mm<br>F = Hole Wizard ANSI Metric Counterbore, Hex Bolt ANSI B18.2.3.5M, M8, Close fit, Ø15.00 through, Ø30.00 counterbore × 10.00 deep, Through All<br><br><b>What is the mass of the part in grams?</b>', a:['14139.65','14298.56','15118.41','14207.34'], correct:3, explain:'<b>Official answer: d) 14207.34 g.</b><br><br>This is the published answer key from the Dassault CSWP sample exam. If your model gives one of the other three values you have almost certainly mis-set a driven dimension — the distractors are built from plausible errors, which is exactly why the multiple choice exists. Note that questions 2, 3 and 5 have <i>no</i> options to check yourself against.' },
    { id:'pq2', topic:'t9', official:true, q:'<b>OFFICIAL SAMPLE — Q2 · Update parameters.</b><br>Same part, same material and settings. Change only the labelled parameters and rebuild.<br><br>A = 225 mm · B = 210 mm · C = 176 mm · D = 137 mm · E = 39 mm<br>X = A/3 · Y = B/3 + 10 mm<br><br><b>What is the mass of the part in grams?</b>', a:['15100.47','16490.45','14208.00','13206.40'], correct:1, explain:'<b>Official answer: 16490.45 g.</b><br><br>In the real exam this is a <b>fill-in-the-blank</b> — the four options here are the other answers from this same paper, added so you can self-test. A robust model gets this in under a minute: change five global variables, rebuild, re-read mass properties.' },
    { id:'pq3', topic:'t9', official:true, q:'<b>OFFICIAL SAMPLE — Q3 · Update parameters again.</b><br>Same part and settings.<br><br>A = 209 mm · B = 218 mm · C = 169 mm · D = 125 mm · E = 41 mm<br>X = A/3 · Y = B/3 + 10 mm<br><br><b>What is the mass of the part in grams?</b>', a:['15100.47','14207.34','16490.45','13395.79'], correct:0, explain:'<b>Official answer: 15100.47 g.</b><br><br>Fill-in-the-blank in the real exam. Note that B has <i>increased</i> while A and D decreased — the mass sits between the Q1 and Q2 answers. Sanity-checking the direction of change is a cheap way to catch a broken rebuild.' },
    { id:'pq4', topic:'t9', official:true, q:'<b>OFFICIAL SAMPLE — Q4 · Stage 2, Modify.</b><br>Modify the part per the Stage 2 images; changes are concentrated in areas AA, BB and CC. Same material and settings.<br><br>A = 221 mm · B = 211 mm · C = 165 mm · D = 121 mm · E = 37 mm<br>X = A/3 · <b>Y = B/3 + 15 mm</b> &nbsp;← the equation for Y has changed<br><br><b>What is the mass of the part in grams?</b>', a:['13095.40','13206.40','13313.35','13395.79'], correct:1, explain:'<b>Official answer: b) 13206.40 g.</b><br><br>The examinable moment of the whole paper: <b>the equation for Y changed</b> from +10 to +15. A candidate who entered Y as a typed number rather than an equation now has to hunt for it. A candidate who used a global variable edits one character. This is precisely what Hints 1–3 are protecting you from.' },
    { id:'pq5', topic:'t9', official:true, q:'<b>OFFICIAL SAMPLE — Q5 · Stage 2, Update parameters.</b><br>Same Stage 2 geometry and settings.<br><br>A = 229 mm · B = 217 mm · C = 163 mm · D = 119 mm · E = 34 mm<br>X = A/3 · Y = B/3 + 15 mm<br><br><b>What is the mass of the part in grams?</b>', a:['13206.40','14207.34','14208.00','15100.47'], correct:2, explain:'<b>Official answer: 14208.00 g.</b><br><br>Fill-in-the-blank in the real exam. Worth noticing: 14208.00 is only 0.66 g away from the Q1 answer of 14207.34, on completely different geometry and parameters. <b>Coincidences like this are why you must actually rebuild rather than pattern-match.</b>' },

    /* ---- theory and technique ---- */
    { id:'pq6', topic:'t1', q:'What is the maximum score and pass mark for CSWP Segment 1?', a:['100 points, 70 to pass','105 points, 75 to pass','104 points, 77 to pass','109 points, 77 to pass'], correct:1, explain:'Segment 1 is <b>70 minutes, 75 of 105 points</b>. Segment 2 is 77 of 104 in 50 minutes; Segment 3 is 77 of 109 in 80 minutes. All three differ, and the exam page states each separately.' },
    { id:'pq7', topic:'t1', q:'Which CSWP segment covers configurations and design tables?', a:['Segment 1','Segment 2','Segment 3','All three'], correct:1, explain:'Segment 2 — 50 minutes, the shortest segment. Segment 1 is part modelling from a drawing; Segment 3 is assemblies.' },
    { id:'pq8', topic:'t1', q:'What is the official term for dimensions that share a single value across a part?', a:['Global dimensions','Linked values, also called shared values','Driven dimensions','Reference dimensions'], correct:1, explain:'Right-click a dimension → <b>Link Values</b>, give it a name, and every dimension with that name updates together. The official CSWP hints put this technique first.' },
    { id:'pq9', topic:'t1', q:'In the SOLIDWORKS equations dialogue, how would you drive a dimension to one third of a global variable A?', a:['Type the calculated number into the dimension','"D1@Sketch1" = "A" / 3','Set a linked value named A/3','Use a design table only'], correct:1, explain:'Reference the dimension by name in double quotes and write the expression. Typing a calculated number works until the exam changes A — and then it silently does not.' },
    { id:'pq10', topic:'t1', q:'Why does the official guide recommend renaming dimensions to A, B, C, D?', a:['It reduces file size','It makes it immediately visible which dimensions the exam is asking you to change','It is required by the exam software','It improves rebuild speed'], correct:1, explain:'Hint 2 of the official sample exam. It costs about a minute and removes the risk of updating the wrong dimension under time pressure. Hint 3 offers a design table as the alternative.' },
    { id:'pq11', topic:'t1', q:'Which of these make a Segment 1 model robust to parameter changes? (Select all that apply.)', a:['Fully defining every sketch','Using sketch relations such as symmetric and equal','Dimensioning to fillet edges','Driving repeated values with global variables'], correct:[0,1,3], multi:true, explain:'Dimensioning to a fillet edge is fragile — the edge can move or vanish when parameters change. The other three are exactly what keeps a model rebuilding cleanly through four parameter updates.' },
    { id:'pq12', topic:'t2', q:'Which unit system does the official CSWP sample exam specify?', a:['IPS (inch, pound, second)','MMGS (millimetre, gram, second)','MKS (metre, kilogram, second)','CGS (centimetre, gram, second)'], correct:1, explain:'MMGS throughout, with 2 decimal places. Set Document Properties → Units before modelling — converting afterwards is where errors creep in.' },
    { id:'pq13', topic:'t2', q:'On a multiple-choice mass question your computed answer is not among the four options. What does this mean?', a:['Round to the nearest option','Your model is wrong — go back and check it','The question is faulty; report it','Choose the closest option'], correct:1, explain:'The official guide states this explicitly: the multiple choice exists so you can verify your model is on the right track. If your answer is not listed, something is wrong — and on fill-in-the-blank questions you get no such warning.' },
    { id:'pq14', topic:'t2', q:'The sample exam specifies Alloy Steel with a density of 0.0077 g/mm³. What is this in kg/m³?', a:['770','7,700','77,000','0.77'], correct:1, explain:'0.0077 g/mm³ × 10⁶ mm³/m³ = 7,700 g per litre... more directly, 0.0077 g/mm³ = 7,700 kg/m³ — a perfectly normal steel density, and a useful sanity check that your units are right.' },
    { id:'pq15', topic:'t2', q:'Why does the official guide recommend saving a version of the model after each question?', a:['To reduce rebuild time','So you can recover a known-good model and fix errors discovered later in the test','Because the exam requires file submission','To prevent the software crashing'], correct:1, explain:'Instruction 4 of the official guide. If a Stage 2 modification goes wrong, you can return to a working Stage 1 part instead of rebuilding from nothing with the clock running.' },
    { id:'pq16', topic:'t3', q:'Mass properties are reported for which configuration?', a:['The default configuration always','The active configuration','An average of all configurations','The first configuration in the list'], correct:1, explain:'The <b>active</b> one. Reading mass with the wrong configuration active is the classic Segment 2 error, and nothing on screen warns you that it has happened.' },
    { id:'pq17', topic:'t3', q:'A derived configuration inherits from its parent. What happens when the parent is changed?', a:['Nothing; derived configurations are independent','The change propagates to the derived configuration unless that item has been explicitly overridden','The derived configuration is deleted','SOLIDWORKS prompts you to rebuild manually'], correct:1, explain:'Inheritance with override. That is what makes derived configurations useful for families — and what makes them surprising if you forget which items were overridden.' },
    { id:'pq18', topic:'t3', q:'When changing a dimension, what does choosing "This configuration" do?', a:['Applies the change to every configuration','Applies the change only to the active configuration, making the dimension configuration-specific','Creates a new configuration','Suppresses the feature in other configurations'], correct:1, explain:'It becomes a configuration-specific dimension and will appear as a column in a design table. Read this dialogue every time — the default is not always what you want, and the error is invisible until you switch configurations.' },
    { id:'pq19', topic:'t4', q:'In a SOLIDWORKS design table, what does the header $STATE@Fillet1 control?', a:['The fillet radius','Whether Fillet1 is suppressed or unsuppressed','The fillet colour','The rebuild order of Fillet1'], correct:1, explain:'Suppression state, with values <span class="mono">S</span> and <span class="mono">U</span>. Dimension columns use <span class="mono">D1@Sketch1</span> form; <span class="mono">$COMMENT</span> and <span class="mono">$PRP@…</span> handle comments and properties.' },
    { id:'pq20', topic:'t4', q:'In a design table, what does each row represent?', a:['A feature','A configuration','A dimension','A part in an assembly'], correct:1, explain:'Rows are configurations (names in column A from A3 down); columns are the controlled parameters, with headers in row 2. Cell A1 is reserved.' },
    { id:'pq21', topic:'t4', q:'What software must be installed to use design tables in the CSWP exam?', a:['SOLIDWORKS PDM','Microsoft Excel','SOLIDWORKS Simulation','Microsoft Access'], correct:1, explain:'Excel. The official exam guide lists it as a requirement, and discovering it is missing at the start of a 50-minute timed segment is unrecoverable.' },
    { id:'pq22', topic:'t4', q:'Reordering features in the FeatureManager tree can change the resulting geometry. Which pair demonstrates this best?', a:['Two sketches on the same plane','A fillet and a shell','Two linear patterns','A plane and an axis'], correct:1, explain:'Shell-then-fillet and fillet-then-shell produce genuinely different parts — different wall geometry and different mass. If a question asks you to reorder and then report mass, the changed number is the point.' },
    { id:'pq23', topic:'t5', q:'In an assembly, what is the status of the first component inserted?', a:['Floating','Fixed','Under-defined','Flexible'], correct:1, explain:'Fixed by default, shown with an (f) prefix. Every subsequent component is floating. A component that will not move for a collision check is very often simply fixed.' },
    { id:'pq24', topic:'t5', q:'A subassembly must articulate inside a parent assembly. What must you set?', a:['Make it rigid','Make it flexible','Dissolve the subassembly','Add a gear mate'], correct:1, explain:'Subassemblies are <b>rigid</b> by default and will not articulate. Rigid versus flexible is an explicitly listed Segment 3 topic, and a rigid subassembly gives wrong motion answers silently.' },
    { id:'pq25', topic:'t5', q:'Which mate centres a tab within a slot?', a:['Symmetric','Width','Distance','Limit'], correct:1, explain:'The <b>Width</b> advanced mate. Symmetric requires a plane and mates two entities symmetrically about it; Width directly centres one set of faces between another.' },
    { id:'pq26', topic:'t5', q:'Which of these are mechanical mates? (Select all that apply.)', a:['Gear','Rack and Pinion','Concentric','Screw'], correct:[0,1,3], multi:true, explain:'Concentric is a <b>standard</b> mate. Gear, Rack and Pinion, Screw, Cam, Hinge, Slot and Universal Joint are the mechanical set.' },
    { id:'pq27', topic:'t5', q:'A gear mate is applied between two shafts. What does it guarantee?', a:['That the gear teeth mesh without interference','That the two rotations maintain the specified ratio','That the correct gear module is used','That the assembly will not over-define'], correct:1, explain:'It is a <b>kinematic constraint</b> only — it enforces the ratio regardless of whether real teeth could mesh. Checking that they physically fit is a separate interference question.' },
    { id:'pq28', topic:'t6', q:'What is the difference between interference detection and collision detection?', a:['They are the same tool with different names','Interference is static — overlap in the current position; collision is dynamic — contact while a component is moved','Interference is for parts, collision is for assemblies','Collision reports volume, interference does not'], correct:1, explain:'Interference asks "do they overlap now?"; collision asks "do they hit while moving?" The exam uses the two words deliberately, and it is interference that reports a <b>volume</b>.' },
    { id:'pq29', topic:'t6', q:'Interference Detection reports which quantity for each interference found?', a:['The contact force','The interference volume','The clearance','The number of mates involved'], correct:1, explain:'Volume — and the exam may ask for that number directly, so read it in the units the question wants.' },
    { id:'pq30', topic:'t6', q:'A component will not move when you try to drag it for a collision check. What are the likely reasons? (Select all that apply.)', a:['It is fixed','It is fully mated with no remaining degrees of freedom','Collision detection is disabled','It is in a rigid subassembly'], correct:[0,1,3], multi:true, explain:'All three are about degrees of freedom. Disabling collision detection would not prevent the drag itself — it would just stop reporting contact.' },
    { id:'pq31', topic:'t7', q:'When mass properties are reported about a custom coordinate system, which values change?', a:['Mass and volume','Centre of mass and moments of inertia','Density','Surface area'], correct:1, explain:'Mass, volume, density and surface area are frame-independent. Centre of mass coordinates and moments of inertia are <b>frame-dependent</b> — which is precisely why the exam pairs the two topics.' },
    { id:'pq32', topic:'t7', q:'How do you create a coordinate system in SOLIDWORKS?', a:['Tools → Options → Coordinate System','Insert → Reference Geometry → Coordinate System','Right-click the origin → New Coordinate System','It is created automatically with each part'], correct:1, explain:'Insert → Reference Geometry → Coordinate System. Pick an origin point, then define the axis directions from edges or faces — and check the flip arrows, because a wrong flip gives right magnitudes with wrong signs.' },
    { id:'pq33', topic:'t7', q:'After replacing a component in an assembly, what should you do first?', a:['Rebuild the drawing','Repair any broken mates, then re-run interference detection','Delete and re-add all mates','Save as a new assembly'], correct:1, explain:'Mates that cannot find their references go to the Mate Entities repair dialogue — re-picking a face or two is normal. Then re-check interference, because the new part may be a different size.' },
    { id:'pq34', topic:'t8', q:'How long must you wait before retaking a failed CSWP segment?', a:['7 days','14 days','30 days','90 days'], correct:1, explain:'14 days per segment, and a new exam credit for that segment. Only the failed segment is repurchased — passed segments never need retaking. (Expert-level exams have a 90-day wait.)' },
    { id:'pq35', topic:'t8', q:'Can a CSWP segment be paused once started?', a:['Yes, once per segment','Yes, for up to 15 minutes','No — the exam cannot be paused and the timer does not stop','Only with proctor approval'], correct:2, explain:'No pausing, and the clock runs through a crash or reboot. The TesterPRO client is designed to resume after a crash, but the elapsed time is gone.' },
    { id:'pq36', topic:'t8', q:'In what order must the three CSWP segments be taken?', a:['Strictly 1, then 2, then 3','Any order, at any time','2 and 3 require 1 to be passed first','All three in one sitting'], correct:1, explain:'Any order, any time, purchased together or individually. Once all three are passed the CSWP is awarded automatically — which is why sitting an easier segment first costs nothing.' },
    { id:'pq37', topic:'t8', q:'What is the minimum SOLIDWORKS version required for the CSWP exam?', a:['2011','2012','2015','2018'], correct:2, explain:'SOLIDWORKS 2015 or later for CSWP — an older version cannot open some of the testing files. CSWA requires 2011+; CSWA-S requires Premium or Simulation 2012+.' },
    { id:'pq38', topic:'t8', q:'Which describes the correct hardware setup for a SOLIDWORKS certification exam?', a:['The tester client must run on a separate machine','SOLIDWORKS and the tester client on one machine with dual monitors is the preferred setup','A Mac with Boot Camp is required','An internet connection is optional'], correct:1, explain:'One machine, two monitors is the recommended arrangement. A second machine is allowed provided you can transfer the exam files between them. An internet connection is <b>required</b> throughout.' },
    { id:'pq39', topic:'t1', q:'Segment 1 gives you a drawing with labelled dimensions and equations, then repeatedly changes the parameters. What is it actually testing?', a:['Speed of sketching','Whether your model rebuilds correctly and preserves design intent when parameters change','Knowledge of drawing standards','Ability to read GD&T'], correct:1, explain:'It is a <b>parametric robustness</b> exam. The initial build is straightforward; the four parameter updates are where the marks are lost, and a fragile model fails them all.' },
    { id:'pq40', topic:'t3', q:'Which of these can a configuration control? (Select all that apply.)', a:['Dimension values','Feature suppression state','Custom properties','The part material'], correct:[0,1,2,3], multi:true, explain:'All four. Dimensions, suppression, configuration-specific custom properties and material can all vary by configuration — which is why the active configuration matters so much when reporting mass.' }
  ]
};

 { t:'SOLIDWORKS certification', c:'v-purple',
   d:'Read the guide, drill the question banks in this app, then sit the exams in the recommended order: CSWA-SD, then CSWP segments 2-3-1, then CSWA-S.',
   ids:['GUIDE','A49','A62','SD-CRS'] }
];

/* ---- progress ---- */
function emptyQ(){ return { right:{}, wrong:{}, attempts:[] }; }
function emptyProg(){ return { mods:{}, quiz:{ sd:emptyQ(), s:emptyQ(), p:emptyQ() } }; }
function loadProg(){
  try {
    const r = localStorage.getItem(K_PROG); if (!r) return emptyProg();
    const o = JSON.parse(r), b = emptyProg();
    b.mods = o.mods || {};
    for (const k of ['sd','s','p']) if (o.quiz && o.quiz[k]) {
      b.quiz[k].right = o.quiz[k].right || {}; b.quiz[k].wrong = o.quiz[k].wrong || {};
      b.quiz[k].attempts = Array.isArray(o.quiz[k].attempts) ? o.quiz[k].attempts : [];
    }
    return b;
  } catch(e){ return emptyProg(); }
}
function saveProg(){ try { localStorage.setItem(K_PROG, JSON.stringify(S.prog)); } catch(e){} }

const S = {
  view:'home', catOpen:{}, q:'', font:18, prog:loadProg(),
  examId:null, pool:[], qIdx:0, sel:[], answered:false, quizMode:'all',
  mock:null, mockTimer:null
};
(function(){ try{ const f=parseInt(localStorage.getItem(K_FONT),10); if(f>=14&&f<=28) S.font=f; }catch(e){} })();

/* ---- helpers ---- */
const ALLMODS = LIB.cats.reduce((a,c)=>a.concat(c.m.map(m=>Object.assign({cat:c},m))),[]);
const MODBY = {}; ALLMODS.forEach(m=>{ MODBY[m.id]=m; });
const CARDBY = {}; LIB.cards.forEach(c=>{ CARDBY[c.n]=c; });
const PATHS = PATHS_RAW.map(p=>Object.assign({},p,{mods:p.ids.map(i=>MODBY[i]).filter(Boolean)})).filter(p=>p.mods.length);

function isRead(id){ return !!(S.prog.mods[id] && S.prog.mods[id].r); }
function readCount(){ return ALLMODS.filter(m=>isRead(m.id)).length; }
function pct(n,d){ return d>0 ? Math.round(100*n/d) : 0; }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function catPct(c){ return pct(c.m.filter(m=>isRead(m.id)).length, c.m.length); }
function totalQ(){ return Object.keys(EXAMS).reduce((a,k)=>a+EXAMS[k].questions.length,0); }
function quizRight(){ return Object.keys(EXAMS).reduce((a,k)=>a+EXAMS[k].questions.filter(q=>S.prog.quiz[k].right[q.id]).length,0); }
function fmtTime(ms){ if(ms<0)ms=0; const s=Math.floor(ms/1000),m=Math.floor(s/60);
  return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function isMulti(q){ return Array.isArray(q.correct); }
function corSet(q){ return isMulti(q)? q.correct.slice().sort() : [q.correct]; }
function sameSet(a,b){ a=a.slice().sort(); b=b.slice().sort();
  return a.length===b.length && a.every((v,i)=>v===b[i]); }

function toggleRead(id, ev){
  if (ev) { ev.stopPropagation(); ev.preventDefault(); }
  const cur = isRead(id);
  S.prog.mods[id] = { r: cur?0:1, t: Date.now() };
  saveProg(); render();
}
function setFont(d){ S.font=Math.max(14,Math.min(28,S.font+d));
  try{ localStorage.setItem(K_FONT,String(S.font)); }catch(e){}
  document.body.className='fs-'+S.font; }
function setAccent(hex){ const r=document.documentElement.style;
  r.setProperty('--ac', hex||'#7DAB87'); r.setProperty('--ac2', hex?hex:'#95C19F'); }

function go(v, o){
  o=o||{};
  if(S.mockTimer){ clearInterval(S.mockTimer); S.mockTimer=null; }
  if('examId' in o) S.examId=o.examId;
  S.view=v;
  if(v!=='quiz'&&v!=='mock'&&v!=='result') setAccent(null); 
  render(); window.scrollTo(0,0);
}

/* ================= RENDER ================= */
function render(){
  ['home','library','paths','quiz','progress'].forEach(v=>{
    const b=document.getElementById('nv-'+v);
    if(b) b.className='nv'+((S.view===v||(v==='quiz'&&(S.view==='mock'||S.view==='result')))?' on':'');
  });
  const a=document.getElementById('app'); const v=S.view;
  if(v==='home') a.innerHTML=vHome();
  else if(v==='library') a.innerHTML=vLibrary();
  else if(v==='paths') a.innerHTML=vPaths();
  else if(v==='quiz') a.innerHTML=vQuiz();
  else if(v==='mock') a.innerHTML=vMock();
  else if(v==='result') a.innerHTML=vResult();
  else if(v==='progress') a.innerHTML=vProgress();
  else a.innerHTML=vHome();
  if(v==='mock'&&S.mock&&!S.mock.submitted) tick();
  const s=document.getElementById('searchBox');
  if(s){ s.value=S.q; s.oninput=function(){ S.q=this.value; renderResults(); }; }
}

/* ---- module row ---- */
function modRow(m, cc){
  const done=isRead(m.id);
  const chips=[]
    .concat(m.p?['<span class="chip ac">'+m.p+' pages</span>']:[])
    .concat((m.tags||[]).slice(0,3).map(t=>'<span class="chip">'+esc(t)+'</span>'))
    .concat(m.mc?['<a class="chip micro" href="'+esc(m.mc)+'" target="_blank" rel="noopener">&#8596; micro '+esc(m.mn)+'</a>']:[]);
  return '<div class="mod'+(done?' done':'')+'" style="--cc:'+cc+'">'
    + '<div class="mi">'+(m.ico||'&#128218;')+'</div>'

    + '<div class="mt">'+esc(m.t)+'</div>'

    + '<a class="btn sm" href="'+esc(m.h)+'" target="_blank" rel="noopener" onclick="markOpened(\''+m.id+'\')">Open</a>'
    + '<button class="tick'+(done?' on':'')+'" title="Mark as read" onclick="toggleRead(\''+m.id+'\',event)">'+(done?'&#10003;':'&#9711;')+'</button>'

}
function markOpened(id){ if(!S.prog.mods[id]) { S.prog.mods[id]={r:0,t:Date.now(),o:1}; saveProg(); } }

/* ---- search ---- */
function renderResults(){
  const el=document.getElementById('results'); if(!el) return;
  const q=S.q.trim().toLowerCase();
  if(q.length<2){ el.innerHTML=''; return; }
  const terms=q.split(/\s+/);
  const hitsM=ALLMODS.filter(m=>{
    const hay=(m.id+' '+m.t+' '+m.d+' '+m.k+' '+m.cat.t).toLowerCase();
    return terms.every(t=>hay.indexOf(t)>=0);
  }).slice(0,12);
  const hitsC=LIB.cards.filter(c=>(c.n+' '+c.t).toLowerCase().indexOf(q)>=0).slice(0,8);
  if(!hitsM.length && !hitsC.length){ el.innerHTML='<div class="empty">Nothing matches &ldquo;'+esc(S.q)+'&rdquo;.</div>'; return; }
  el.innerHTML = '<h2>'+(hitsM.length+hitsC.length)+' result'+((hitsM.length+hitsC.length)===1?'':'s')+'</h2>'
    + hitsM.map(m=>modRow(m, CC[m.cat.c]||'#7DAB87')).join('')
    + (hitsC.length ? '<h2>Micro cards</h2><div class="grid g2">'
        + hitsC.map(c=>'<a class="card tight" style="text-decoration:none;display:block" href="'+esc(c.f)+'" target="_blank" rel="noopener">'
        + '<div class="mn" style="--cc:#C0B5DC;color:#C0B5DC">CARD '+esc(c.n)+'</div><div class="mt">'+esc(c.t)+'</div></a>').join('')
        + '</div>' : '');
}
