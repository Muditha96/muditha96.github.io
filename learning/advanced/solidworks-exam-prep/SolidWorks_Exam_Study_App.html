<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SOLIDWORKS Exam Study App &middot; CSWA-SD &middot; CSWA-S &middot; CSWP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #1a2825;
    font-family: 'Atkinson Hyperlegible', system-ui, -apple-system, sans-serif;
    color: #EFE7D6; font-size: 18px; line-height: 1.7;
    letter-spacing: 0.01em; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body.fs-14 { font-size: 14px; } body.fs-16 { font-size: 16px; }
  body.fs-18 { font-size: 18px; } body.fs-20 { font-size: 20px; }
  body.fs-22 { font-size: 22px; } body.fs-24 { font-size: 24px; }
  body.fs-26 { font-size: 26px; } body.fs-28 { font-size: 28px; }
  .display { font-family: 'Fraunces', Georgia, serif; letter-spacing: -0.01em; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 20px 120px; }
  a { color: #95C19F; }

  /* ---- accent is re-pointed per exam ---- */
  :root { --ac: #7DAB87; --ac2: #95C19F; --acd: #14201D; }

  h1 { font-size: 2.0em; margin: 0 0 6px; line-height: 1.22; }
  h2 { font-size: 1.3em; margin: 34px 0 14px; color: #C9DCCC; }
  h3 { font-size: 1.12em; margin: 0 0 8px; }
  p  { margin: 10px 0 0; }
  .sub { color: #A9BDB5; margin: 0 0 4px; }
  .muted { color: #A9BDB5; }
  .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: .9em; }

  .topbar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
            padding: 14px 20px; background:#1b2926; border-bottom:1px solid #2f4641;
            position:sticky; top:0; z-index:40; }
  .brand { display:flex; align-items:center; gap:12px; font-weight:700; }
  .brand .dot { width:12px; height:12px; border-radius:50%; background:var(--ac); box-shadow:0 0 12px var(--ac); }
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  button { font-family: inherit; font-size: 1em; cursor: pointer; }
  .btn { background: var(--ac); color: var(--acd); border: none;
         padding: 12px 22px; border-radius: 12px; font-weight: 700; }
  .btn:hover { background: var(--ac2); }
  .btn.ghost { background: transparent; color: #EFE7D6; border: 1px solid #4a6661; }
  .btn.ghost:hover { background: #2f4641; }
  .btn.sm { padding: 7px 14px; font-size: .86em; border-radius: 9px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.danger { background: transparent; color: #C97A7A; border: 1px solid #6b3f3f; }

  .card { background:#243532; border-radius:18px; padding:26px; border:1px solid #2f4641; margin-bottom:18px; }
  .card.tight { padding: 18px 20px; }
  .grid { display:grid; gap:16px; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); }

  .pill { display:inline-block; padding:4px 13px; border-radius:999px; font-size:.76em;
          font-weight:700; letter-spacing:.03em; white-space:nowrap; }
  .pill-ac { background: var(--ac); color: var(--acd); }
  .pill-q  { background:#2f4641; color:#C9DCCC; }
  .pill-warn { background:#3f4638; color:#D9A574; }
  .pill-bad  { background:#4a2c2c; color:#E5A3A3; }
  .pill-good { background:#2a4a36; color:#8BC082; }

  /* exam picker */
  .exam-card { background:#243532; border:1px solid #2f4641; border-radius:18px; padding:24px;
               display:flex; flex-direction:column; gap:12px; text-align:left; width:100%;
               color:#EFE7D6; transition: border-color .15s; }
  .exam-card:hover { border-color: var(--pc); }
  .exam-card .code { font-size:.8em; font-weight:700; letter-spacing:.08em; color:var(--pc); }
  .exam-card h3 { font-size:1.22em; margin:0; }
  .exam-card .spec { color:#A9BDB5; font-size:.88em; }

  .bar { height:10px; background:#1b2926; border-radius:999px; overflow:hidden; border:1px solid #2f4641; }
  .bar > i { display:block; height:100%; background:var(--ac); border-radius:999px; }
  .bar.pc > i { background: var(--pc); }

  .stat { background:#1e2d2a; border:1px solid #2f4641; border-radius:14px; padding:16px 18px; }
  .stat .n { font-size:1.9em; font-weight:700; color:var(--ac); font-family:'Fraunces',serif; line-height:1.1; }
  .stat .l { color:#A9BDB5; font-size:.84em; }

  /* spec table */
  table { width:100%; border-collapse:collapse; font-size:.94em; }
  th, td { padding:11px 13px; text-align:left; border-bottom:1px solid #2f4641; vertical-align:top; }
  th { color:#C9DCCC; font-weight:700; }
  tr:last-child td { border-bottom:none; }
  .tbl-wrap { overflow-x:auto; border:1px solid #2f4641; border-radius:14px; }

  /* topic rows */
  .trow { display:flex; align-items:center; gap:14px; padding:14px 16px; background:#1e2d2a;
          border:1px solid #2f4641; border-radius:14px; margin-bottom:10px; width:100%;
          color:#EFE7D6; text-align:left; }
  .trow:hover { border-color: var(--ac); }
  .trow .ti { width:38px; height:38px; border-radius:10px; flex:0 0 auto;
              display:flex; align-items:center; justify-content:center; font-weight:700;
              background:#2a3d39; color:var(--ac); font-size:.9em; }
  .trow .tt { flex:1 1 auto; }
  .trow .tn { font-weight:700; }
  .trow .tm { color:#A9BDB5; font-size:.82em; }

  /* study card */
  .lesson { background:#243532; border:1px solid #2f4641; border-radius:18px; padding:28px; }
  .lesson h3 { font-size:1.35em; color:var(--ac2); }
  .keylist { list-style:none; padding:0; margin:16px 0 0; display:grid; gap:10px; }
  .keylist li { background:#1e2d2a; border-left:3px solid var(--ac); border-radius:10px;
                padding:12px 15px; font-size:.95em; }
  .hook { margin-top:16px; background:#2a3d39; border:1px dashed #4a6661; border-radius:12px; padding:14px 16px; }
  .hook .hl { font-size:.78em; font-weight:700; letter-spacing:.05em; color:#D9A574; text-transform:uppercase; }
  .trapbox { margin-top:16px; background:#3a2f2c; border-left:3px solid #D9A574; border-radius:10px; padding:13px 16px; }
  .trapbox .hl { font-size:.78em; font-weight:700; letter-spacing:.05em; color:#D9A574; text-transform:uppercase; }

  /* quiz */
  .qtext { font-size:1.12em; font-weight:700; line-height:1.5; }
  .opts { display:grid; gap:10px; margin-top:18px; }
  .opt { text-align:left; background:#1e2d2a; border:1px solid #3a5450; color:#EFE7D6;
         padding:14px 17px; border-radius:12px; line-height:1.5; display:flex; gap:12px; align-items:flex-start; }
  .opt:hover:not(.locked) { border-color: var(--ac); background:#243532; }
  .opt .mk { flex:0 0 auto; width:26px; height:26px; border-radius:7px; background:#2f4641;
             display:flex; align-items:center; justify-content:center; font-size:.8em; font-weight:700; }
  .opt.sel { border-color: var(--ac); }
  .opt.sel .mk { background: var(--ac); color: var(--acd); }
  .opt.right { border-color:#7DAB87; background:#22352b; }
  .opt.right .mk { background:#7DAB87; color:#14201D; }
  .opt.wrong { border-color:#C97A7A; background:#33262a; }
  .opt.wrong .mk { background:#C97A7A; color:#2a1717; }
  .opt.locked { cursor: default; }
  .explain { margin-top:16px; padding:16px 18px; border-radius:12px; background:#1e2d2a; border-left:3px solid var(--ac); }
  .verdict { font-weight:700; margin-bottom:6px; }
  .v-ok { color:#8BC082; } .v-no { color:#E5A3A3; }

  .qbar { display:flex; align-items:center; justify-content:space-between; gap:12px;
          flex-wrap:wrap; margin-bottom:16px; color:#A9BDB5; font-size:.88em; }
  .timer { font-family: ui-monospace, monospace; font-weight:700; font-size:1.05em; color:#C9DCCC;
           background:#1b2926; border:1px solid #2f4641; padding:6px 14px; border-radius:10px; }
  .timer.warn { color:#D9A574; border-color:#6b5a3a; }
  .timer.crit { color:#E5A3A3; border-color:#6b3f3f; }

  .navrow { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
  .spacer { flex:1 1 auto; }

  /* summary grid for mock exam */
  .sumgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(46px,1fr)); gap:8px; margin-top:14px; }
  .sq { aspect-ratio:1; border-radius:9px; border:1px solid #3a5450; background:#1e2d2a;
        color:#A9BDB5; font-size:.82em; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .sq.done { background:#2a3d39; color:#EFE7D6; border-color:var(--ac); }
  .sq.cur { outline:2px solid var(--ac2); }
  .sq.ok { background:#2a4a36; color:#8BC082; border-color:#4d7a5c; }
  .sq.no { background:#4a2c2c; color:#E5A3A3; border-color:#7a4d4d; }

  .banner { border-radius:14px; padding:18px 20px; margin-bottom:18px; border:1px solid; }
  .banner.good { background:#22352b; border-color:#4d7a5c; }
  .banner.bad  { background:#33262a; border-color:#7a4d4d; }
  .banner .big { font-size:1.6em; font-weight:700; font-family:'Fraunces',serif; }

  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .tab { background:#1e2d2a; border:1px solid #2f4641; color:#A9BDB5;
         padding:9px 18px; border-radius:11px; font-size:.9em; }
  .tab.on { background:var(--ac); color:var(--acd); border-color:var(--ac); font-weight:700; }

  .empty { text-align:center; color:#A9BDB5; padding:40px 20px; }
  .fnote { font-size:.84em; color:#A9BDB5; margin-top:10px; }
  .srcnote { font-size:.8em; color:#8FA39C; border-top:1px solid #2f4641; margin-top:26px; padding-top:14px; }

  @media (max-width:600px) {
    .wrap { padding:18px 14px 110px; }
    .card, .lesson { padding:20px 17px; border-radius:15px; }
    h1 { font-size:1.65em; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body class="fs-18">
<div class="topbar">
  <div class="brand"><span class="dot"></span><span id="brandTxt">SOLIDWORKS Exam Study</span></div>
  <div class="toolbar">
    <button class="btn ghost sm" onclick="setFont(-2)" title="Smaller text">A&minus;</button>
    <button class="btn ghost sm" onclick="setFont(2)" title="Larger text">A+</button>
    <button class="btn ghost sm" onclick="go('home')">Home</button>
  </div>
</div>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   SOLIDWORKS EXAM STUDY APP  —  data-driven, single file
   Exams: CSWA-SD (Sustainability) · CSWA-S (Simulation) · CSWP
   Exam specs verified against solidworks.com, Feb 2026.
   ============================================================ */

const EXAMS = {};

/* ============================ CSWA-SD ============================ */
EXAMS.sd = {
  id: 'sd', code: 'CSWA-SD', name: 'Sustainability Associate',
  accent: '#7DAB87', accent2: '#95C19F',
  tagline: 'Pure knowledge exam. No SOLIDWORKS needed — and the highest pass mark of the three.',
  spec: {
    'Exam length': '60 minutes, online proctored',
    'Questions': '30 questions, 1 point each',
    'Pass mark': '24 / 30 — that is 80%, NOT the usual 70%',
    'Format': 'Multiple choice and multi-answer only',
    'Software needed': 'None. No SOLIDWORKS licence, no models to build',
    'Order': 'Answer in any order; a Summary Screen shows what is unanswered',
    'Retake': '14-day wait, new exam credit required',
    'Results': 'Score and topic areas only — never the individual questions',
    'Source text': 'The SOLIDWORKS Sustainable Design Guide, 10 chapters, ~3–4 h to read',
    'Also known as': 'Formerly CSDA (Certified Sustainable Design Associate)'
  },
  mock: { count: 30, minutes: 60, passPoints: 24, totalPoints: 30 },
  topics: [
    { id:'t1', title:'Sustainability Foundations',      blurb:'Brundtland, triple bottom line, the Natural Step' },
    { id:'t2', title:'Sustainable Design Concepts',     blurb:'DfD, EPR, biomimicry, cradle-to-cradle' },
    { id:'t3', title:'The Product Life Cycle',          blurb:'The five stages — and the one everybody forgets' },
    { id:'t4', title:'Environmental Indicators',        blurb:'The four dashboard numbers and their units' },
    { id:'t5', title:'Assessment Goal & Scope',         blurb:'Functional unit, system boundary, cut-off' },
    { id:'t6', title:'Life Cycle Assessment',           blurb:'ISO 14040/14044, the four phases, screening vs full' },
    { id:'t7', title:'SOLIDWORKS Sustainability',       blurb:'Xpress vs full, baseline, Find Similar, reports' }
  ],
  cards: {
    t1: [
      { id:'sd1-1', title:'The Brundtland definition', body:'The single most quoted sentence in the whole subject, and the one the exam opens with. It comes from the 1987 UN World Commission on Environment and Development report <i>Our Common Future</i>, chaired by Gro Harlem Brundtland.',
        key:['<b>Sustainable development:</b> development that meets the needs of the present without compromising the ability of future generations to meet their own needs','It is about <b>needs</b> — not comfort, not profit, not growth','It is explicitly <b>inter-generational</b>: the future generation is a stakeholder in today\'s decision'],
        hook:{label:'Remember it as', text:'"Meet today\'s needs without stealing tomorrow\'s ability to meet theirs."'} },
      { id:'sd1-2', title:'The triple bottom line', body:'Sustainability is not an environmental subject with an economic footnote. It is the intersection of three systems, and a design that wins on only one of them is not sustainable.',
        key:['<b>Environment</b> — planet: resources, emissions, ecosystems','<b>Society</b> — people: health, labour, communities, equity','<b>Economy</b> — profit: viability, cost, growth','Often written <b>People, Planet, Profit</b>. All three, simultaneously'],
        trap:'A question will offer an option that names only environment and economy. Sustainability always has the <b>social</b> leg — that is usually the discriminator between two plausible answers.' },
      { id:'sd1-3', title:'The Natural Step — four system conditions', body:'A science-based framework for what a sustainable society must not do. It is phrased as four prohibitions, which makes it easy to test.',
        key:['1 — Do not systematically increase concentrations of substances extracted from the <b>Earth\'s crust</b> (fossil fuels, metals, minerals)','2 — Do not systematically increase concentrations of substances <b>produced by society</b> (synthetics) faster than nature can break them down','3 — Do not systematically <b>degrade nature by physical means</b> (deforestation, over-harvesting, habitat destruction)','4 — Do not systematically undermine people\'s <b>capacity to meet their basic needs</b>'],
        hook:{label:'Structure', text:'Three about the physical planet, one about people. Condition 4 is the social leg again — and the one most often missing from a wrong answer.'} },
      { id:'sd1-4', title:'Why design decisions dominate', body:'The reason sustainability belongs in CAD rather than in a compliance department: the leverage is almost entirely at the front of the process.',
        key:['A large majority of a product\'s lifetime environmental impact is <b>locked in during design</b>, when very little money has yet been spent','Once tooling is cut and a supply chain is signed, most of the impact is committed','This is why <b>screening early</b> beats <b>measuring precisely late</b>'],
        hook:{label:'The shape of it', text:'Design spends little and decides much. Manufacturing spends much and decides little.'} }
    ],
    t2: [
      { id:'sd2-1', title:'Design for Disassembly (DfD)', body:'Designing so the product can be taken apart at end of life — quickly, with common tools, without destroying the parts you want back.',
        key:['Reduce the <b>number and variety</b> of fasteners','Prefer mechanical fasteners over <b>adhesives and welds</b> where recovery matters','Avoid <b>composite and co-moulded</b> material combinations that cannot be separated','Mark materials so a recycler can identify them','Make the high-value or hazardous parts the <b>easiest</b> to reach, not the hardest'],
        trap:'DfD is not the same as Design for Recycling. Disassembly enables <b>reuse, repair and remanufacture</b> as well — which sit above recycling in the waste hierarchy.' },
      { id:'sd2-2', title:'Extended Producer Responsibility (EPR)', body:'A policy instrument that makes the manufacturer financially or physically responsible for the product after the consumer has finished with it.',
        key:['Shifts end-of-life cost from the municipality to the <b>producer</b>','Creates a direct commercial incentive to design for recovery','Examples: WEEE for electronics, ELV for vehicles, battery and packaging take-back schemes','It is a <b>policy/economic</b> mechanism, not a design technique'],
        hook:{label:'One line', text:'EPR makes the company that made it, own it — for its whole life.'} },
      { id:'sd2-3', title:'Biomimicry', body:'Solving engineering problems by emulating strategies that biological systems have already evolved.',
        key:['Emulates nature\'s <b>forms, processes and systems</b>','Nature builds at ambient temperature and pressure, with local materials, and produces no waste','Classic examples: burr seeds → hook-and-loop fastener; kingfisher beak → train nose profile; termite mound ventilation → passive building cooling; lotus leaf → self-cleaning surfaces'],
        trap:'Biomimicry means copying the <b>strategy</b>, not the appearance. A part shaped like a leaf is styling; a part that manages water like a leaf is biomimicry.' },
      { id:'sd2-4', title:'Cradle-to-grave vs cradle-to-cradle', body:'Two mental models of a product\'s journey, and the difference between them is the whole argument of modern sustainable design.',
        key:['<b>Cradle-to-grave</b> — linear: extract, make, use, dispose. The product ends as waste','<b>Cradle-to-gate</b> — a partial study: extraction up to the factory gate only. Excludes use and end-of-life','<b>Cradle-to-cradle</b> — circular: end-of-life material becomes feedstock for a new cycle, with no loss of quality','Cradle-to-cradle distinguishes <b>biological</b> nutrients (safely returned to nature) from <b>technical</b> nutrients (kept circulating in industry)'],
        trap:'<b>Cradle-to-gate</b> is a legitimate scope, not a mistake — but an assessment that stops at the gate cannot say anything about the use phase, which for most powered products is the largest impact of all.' },
      { id:'sd2-5', title:'Dematerialization and the other levers', body:'The everyday design moves that actually reduce impact, in rough order of how much they usually deliver.',
        key:['<b>Dematerialization</b> — deliver the same function with less material','<b>Substitution</b> — same function, lower-impact material','<b>Energy efficiency in use</b> — dominant for anything powered','<b>Life extension</b> — durability, repairability, upgradeability','<b>Recycled content</b> and <b>recyclability</b>','<b>Localisation</b> — shorter, lighter, slower-mode transport'],
        hook:{label:'Order matters', text:'Reduce → reuse → recycle. Recycling is the <i>last</i> of the three, not the first.'} }
    ],
    t3: [
      { id:'sd3-1', title:'The five life cycle stages', body:'Every physical product passes through the same five stages. SOLIDWORKS Sustainability evaluates all five, and the exam will ask you to enumerate them.',
        key:['1 — <b>Raw material extraction</b> and processing','2 — <b>Manufacturing</b>','3 — <b>Transportation</b>','4 — <b>Use</b>','5 — <b>End of life</b>'],
        trap:'<b>Transportation is a stage in its own right.</b> A four-item list that jumps from manufacturing straight to use is the classic distractor — and it is the single most reliable wrong answer in this whole topic.' },
      { id:'sd3-2', title:'What happens in each stage', body:'Knowing the boundaries matters, because assessment questions turn on which stage an impact belongs to.',
        key:['<b>Raw material</b> — mining, drilling, harvesting, refining, and the material\'s own upstream burden','<b>Manufacturing</b> — the energy, water, scrap and emissions of turning stock into a part','<b>Transportation</b> — every movement: inbound material, inter-factory, distribution to market','<b>Use</b> — energy and consumables over the product\'s service life; maintenance and spares','<b>End of life</b> — landfill, incineration, recycling, reuse, remanufacture'],
        hook:{label:'Mnemonic', text:'<b>R-M-T-U-E</b> — "Raw Materials Take Up Energy."'} },
      { id:'sd3-3', title:'Which stage dominates?', body:'There is no universal answer, and the exam tests whether you know that the answer depends on the product.',
        key:['<b>Powered products with a long service life</b> (motors, appliances, vehicles) — the <b>use</b> phase usually dominates, often overwhelmingly','<b>Passive products</b> (structural parts, furniture, packaging) — <b>raw material</b> extraction usually dominates','<b>Heavy or air-freighted goods</b> — transportation can become significant','Manufacturing dominates less often than intuition suggests'],
        trap:'A design change that saves material but costs efficiency in use is usually a <b>net loss</b> for a powered product. Always ask which stage dominates before optimising.' }
    ],
    t4: [
      { id:'sd4-1', title:'The four environmental indicators', body:'SOLIDWORKS Sustainability reports four impact numbers. You must know all four, their units, and what each one physically means.',
        key:['<b>Carbon footprint</b> — mass of CO<sub>2</sub> equivalent (CO<sub>2</sub>e). Greenhouse gases, weighted by global warming potential','<b>Total energy consumed</b> — megajoules (MJ). All non-renewable primary energy, including the energy embedded in the fuel supply chain','<b>Air acidification</b> — SO<sub>2</sub> equivalent. Sulphur and nitrogen oxides that produce acid rain','<b>Water eutrophication</b> — PO<sub>4</sub> equivalent (phosphate). Nutrient loading that causes algal blooms and oxygen-starved dead zones'],
        hook:{label:'Pair them', text:'Two are about <b>air</b> (carbon, acidification), one about <b>energy</b>, one about <b>water</b>.'} },
      { id:'sd4-2', title:'Reading the indicators correctly', body:'Each is an equivalence unit — a way of adding up many different substances onto one scale by weighting each by its potency.',
        key:['"CO<sub>2</sub> equivalent" does not mean the product emitted CO<sub>2</sub>. Methane, for example, is counted as its CO<sub>2</sub>-equivalent warming effect','The four indicators <b>can move in opposite directions</b>. A change that lowers carbon may raise eutrophication','There is no single "environmental score" that combines them — and inventing one is a value judgement, not a measurement'],
        trap:'A question may show a material swap that improves three indicators and worsens the fourth. The correct engineering answer is that this is a <b>trade-off requiring a decision</b>, not an automatic improvement.' },
      { id:'sd4-3', title:'Acidification and eutrophication in plain terms', body:'These two are the least familiar and therefore the most tested.',
        key:['<b>Acidification</b> — SO<sub>x</sub> and NO<sub>x</sub> from burning fuels dissolve in atmospheric water and fall as acid rain, damaging forests, soils, freshwater and buildings','<b>Eutrophication</b> — nitrogen and phosphorus reaching water bodies fertilise algae; the bloom dies, decomposes, and consumes the dissolved oxygen, killing fish','Acidification is measured against <b>sulphur dioxide</b>; eutrophication against <b>phosphate</b>'],
        hook:{label:'Do not swap them', text:'<b>Air</b> gets <b>acid</b> (SO<sub>2</sub>). <b>Water</b> gets <b>fed</b> (PO<sub>4</sub>).'} }
    ],
    t5: [
      { id:'sd5-1', title:'Goal and scope — where every assessment starts', body:'Before a single number is calculated, an assessment must state what question it is answering and what it will count. Get this wrong and every subsequent figure is meaningless.',
        key:['<b>Goal</b> — why the study is being done, and for whom','<b>Scope</b> — what is included: system boundary, functional unit, data quality, assumptions, limitations','Scope decisions are where most of the disagreement between two studies of the "same" product comes from'],
        trap:'Two LCAs reaching opposite conclusions about the same product is usually not fraud. It is nearly always a <b>different functional unit or system boundary</b>.' },
      { id:'sd5-2', title:'The functional unit', body:'The quantified performance of the product system, used as the reference to which all inputs and outputs are normalised. It is the single most important idea in this topic.',
        key:['It measures <b>function delivered</b>, not the object','Bad: "one plastic cup". Good: "<b>containing 300 ml of liquid once</b>"','Bad: "one light bulb". Good: "<b>1,000 lumen-hours of illumination over 10 years</b>"','It is what makes two different products <b>comparable</b> — a reusable and a disposable cup can only be compared per use, not per item'],
        hook:{label:'Test yourself', text:'If the unit names an object, it is wrong. If it names a <b>service, a quantity and a duration</b>, it is right.'} },
      { id:'sd5-3', title:'System boundary and cut-off', body:'The line drawn around what the study counts. Everything outside it is assumed to be zero — which is a decision, not a fact.',
        key:['Defines which <b>life cycle stages</b>, which processes and which geography are inside','<b>Cradle-to-grave</b>, <b>cradle-to-gate</b> and <b>gate-to-gate</b> are all boundary choices','<b>Cut-off criteria</b> state the threshold (by mass, energy or environmental relevance) below which a flow is excluded','Boundaries must be stated explicitly, or the study cannot be reviewed or reproduced'],
        trap:'Excluding a stage does not make its impact zero. It makes it <b>unknown</b> — and a study that omits the use phase of a powered product has usually omitted most of the answer.' }
    ],
    t6: [
      { id:'sd6-1', title:'What LCA is, and the standards', body:'Life Cycle Assessment is the formal, standardised method for compiling and evaluating the inputs, outputs and potential environmental impacts of a product system throughout its life.',
        key:['<b>ISO 14040</b> — principles and framework','<b>ISO 14044</b> — requirements and guidelines','LCA is <b>comparative and relative</b>: it expresses potential impacts against a functional unit, not absolute damage at a place and time','It does not predict actual harm to a specific ecosystem'],
        trap:'LCA measures <b>potential</b> impact. It is not a risk assessment and it is not a site-specific environmental impact statement.' },
      { id:'sd6-2', title:'The four phases of an LCA', body:'ISO 14040 defines four phases, and they are iterative — later findings send you back to revise earlier ones.',
        key:['1 — <b>Goal and scope definition</b>','2 — <b>Inventory analysis (LCI)</b> — compile every input and output flow: energy, materials, emissions, waste','3 — <b>Impact assessment (LCIA)</b> — translate inventory flows into impact categories such as carbon, acidification, eutrophication','4 — <b>Interpretation</b> — draw conclusions, check completeness and sensitivity, state limitations'],
        hook:{label:'Interpretation is not last', text:'Interpretation runs <b>alongside</b> all three other phases, not only at the end. The arrows in the ISO diagram point both ways.'} },
      { id:'sd6-3', title:'Screening LCA vs full LCA', body:'The practical distinction that decides which tool you reach for — and the one this exam has been known to test in a way that surprises people.',
        key:['A <b>screening</b> (or streamlined) LCA uses generic database data and simplified assumptions to find the hot spots fast','A <b>full</b> LCA uses primary, product-specific data, documents everything, and can be independently reviewed','SOLIDWORKS Sustainability is a <b>screening</b> tool: it is built for fast design-stage comparison, not for certification','Screening results are directional — they tell you <b>where</b> to act, not a defensible absolute figure'],
        trap:'The Sustainable Design Guide treats screening-level results as usable for <b>communication and marketing</b> claims. That contradicts many textbooks, which reserve public comparative assertions for reviewed full LCAs under ISO 14044. <b>Answer the exam from the Guide</b> — and know the professional caveat for real work.' },
      { id:'sd6-4', title:'Data quality and where uncertainty lives', body:'An LCA is only as good as the inventory behind it, and the exam expects you to be able to say why.',
        key:['<b>Generic/database</b> data is average, regional and dated; <b>primary</b> data comes from the actual supplier and process','Geography matters enormously — the same part made on different electricity grids has very different carbon','<b>Sensitivity analysis</b> tests whether a conclusion survives plausible changes in assumptions','If a conclusion flips under sensitivity analysis, it is not a conclusion'],
        hook:{label:'The honest sentence', text:'"This is a screening result using generic data; the ranking is robust, the absolute values are not."'} }
    ],
    t7: [
      { id:'sd7-1', title:'Sustainability Xpress vs full Sustainability', body:'Two products with the same engine and very different reach. Knowing which does what is straightforward marks.',
        key:['<b>Sustainability Xpress</b> — included with SOLIDWORKS, <b>parts only</b>, limited material set, the four indicators','<b>SOLIDWORKS Sustainability</b> — full add-in: <b>assemblies</b>, configurations, the <b>use phase</b>, transportation, a much larger material database, and reporting','Both are screening tools driven by an underlying commercial LCA database','Both report the same four indicators'],
        trap:'Xpress cannot assess an <b>assembly</b> and cannot model the <b>use phase</b>. If a question involves either, the answer requires full Sustainability.' },
      { id:'sd7-2', title:'The inputs you must supply', body:'The tool cannot compute anything until it knows the four things that define the product\'s life.',
        key:['<b>Material</b> — class and specific material','<b>Manufacturing process</b> and the <b>region</b> where it is made','<b>Use region</b> — where the product is used, which sets the energy grid and the duration','<b>Transportation</b> — mode and distance to market','<b>End of life</b> — the recycled / incinerated / landfill split'],
        hook:{label:'Why region twice', text:'Made in one place, used in another. The <b>manufacturing region</b> sets the factory grid; the <b>use region</b> sets the in-service grid.'} },
      { id:'sd7-3', title:'Baseline, comparison and Find Similar', body:'The three features that turn a number into a decision.',
        key:['<b>Set Baseline</b> stores the current design so subsequent changes are shown as a delta — this is how the tool is meant to be used','The dashboard then shows each indicator as better or worse against that baseline','<b>Find Similar</b> searches for materials with comparable <b>mechanical properties</b> but lower environmental impact','<b>Financial impact</b> gives an indicative cost so the environmental and economic legs can be seen together'],
        trap:'Find Similar filters on <b>engineering properties you choose</b> — it does not know your application. It proposes candidates; qualifying them is still your job.' },
      { id:'sd7-4', title:'Reading the dashboard', body:'The output is a four-segment breakdown plus a life cycle split, and the split is where the insight is.',
        key:['Each indicator is broken down by <b>life cycle stage</b>, so you can see which stage owns the impact','A material change moves the material and manufacturing bars; a duty-cycle change moves the use bar','Reports can be generated for the record, and the assumptions travel with them','The point of the tool is <b>relative comparison of alternatives</b>, at the moment the design is still cheap to change']
      }
    ]
  },
  questions: [
    { id:'sdq1', topic:'t1', q:'How did the Brundtland Commission define sustainable development?', a:['Maximising economic output while minimising environmental regulation','Development that meets the needs of the present without compromising the ability of future generations to meet their own needs','Using only renewable materials in every product','Achieving zero waste in all manufacturing operations'], correct:1, explain:'The 1987 report <i>Our Common Future</i> defined it in exactly these terms. Note the two halves: present <b>needs</b>, and the future generation\'s <b>ability</b> to meet theirs.' },
    { id:'sdq2', topic:'t1', q:'Which three dimensions make up the triple bottom line?', a:['Environment, society, economy','Environment, energy, emissions','Materials, manufacturing, transport','Reduce, reuse, recycle'], correct:0, explain:'People, Planet, Profit — environment, society and economy together. Options that omit the <b>social</b> dimension are the standard distractor.' },
    { id:'sdq3', topic:'t1', q:'Which of the following are system conditions of The Natural Step? (Select all that apply.)', a:['Do not systematically increase concentrations of substances extracted from the Earth\'s crust','Do not systematically increase concentrations of substances produced by society','Do not systematically degrade nature by physical means','Do not systematically undermine people\'s capacity to meet their basic needs'], correct:[0,1,2,3], multi:true, explain:'All four. Three concern the physical planet; the fourth is social. A question that offers only the first three is testing whether you remember the social condition.' },
    { id:'sdq4', topic:'t1', q:'Why is the design stage the highest-leverage point for reducing environmental impact?', a:['Because designers control the manufacturing budget','Because most of a product\'s lifetime impact is committed during design, before significant money has been spent','Because environmental regulations apply only to design documents','Because material costs are highest at the design stage'], correct:1, explain:'Design spends little and decides much. Once tooling and supply chains are committed, the impact is largely locked in regardless of later effort.' },
    { id:'sdq5', topic:'t2', q:'What is the primary aim of Design for Disassembly?', a:['To reduce the number of parts in an assembly','To enable the product to be taken apart efficiently at end of life so components and materials can be recovered','To reduce assembly labour cost on the production line','To allow the product to be flat-packed for shipping'], correct:1, explain:'DfD targets <b>recovery</b> — reuse, repair, remanufacture and recycling. Easier factory assembly is a common and welcome side effect, but it is not the aim.' },
    { id:'sdq6', topic:'t2', q:'Extended Producer Responsibility is best described as:', a:['A design technique for extending product life','A policy approach making the manufacturer responsible for the product at end of life','An extended warranty offered to consumers','A supplier quality management standard'], correct:1, explain:'EPR is a <b>policy/economic</b> instrument (WEEE, ELV, packaging and battery take-back). It shifts end-of-life cost onto the producer, which creates the incentive to design for recovery.' },
    { id:'sdq7', topic:'t2', q:'Which of these is a genuine example of biomimicry?', a:['A car styled to resemble a shark','A train nose profiled like a kingfisher beak to reduce pressure wave on tunnel entry','A green-coloured package to signal environmental credentials','A logo based on a leaf'], correct:1, explain:'Biomimicry copies the functional <b>strategy</b>, not the appearance. The Shinkansen nose is the textbook case; the others are styling or marketing.' },
    { id:'sdq8', topic:'t2', q:'In the cradle-to-cradle model, what happens to material at end of life?', a:['It is landfilled in a controlled facility','It becomes feedstock for a new cycle, as either a biological or a technical nutrient','It is incinerated with energy recovery','It is downcycled into a lower-grade application'], correct:1, explain:'Cradle-to-cradle is circular and distinguishes <b>biological</b> nutrients (safely returned to nature) from <b>technical</b> nutrients (kept circulating in industry) — ideally without loss of quality, which is what separates it from downcycling.' },
    { id:'sdq9', topic:'t2', q:'A "cradle-to-gate" assessment excludes which stages?', a:['Raw material extraction','Manufacturing','Use and end of life','Transportation of raw materials'], correct:2, explain:'Cradle-to-gate runs from extraction up to the factory gate. It legitimately excludes <b>use and end of life</b> — which for a powered product usually means it excludes the largest impact.' },
    { id:'sdq10', topic:'t2', q:'Order the waste hierarchy from most to least preferable.', a:['Recycle, reuse, reduce','Reduce, reuse, recycle','Reuse, recycle, reduce','Recycle, reduce, reuse'], correct:1, explain:'Reduce first (avoid the material entirely), then reuse (keep the object), then recycle (recover the material). Recycling is the <b>last</b> of the three, though it is usually the first people mention.' },
    { id:'sdq11', topic:'t3', q:'List the five stages of a product life cycle as used by SOLIDWORKS Sustainability.', a:['Raw material, manufacturing, use, end of life, recycling','Raw material, manufacturing, transportation, use, end of life','Design, manufacturing, distribution, use, disposal','Extraction, refining, assembly, sale, disposal'], correct:1, explain:'Raw material → Manufacturing → <b>Transportation</b> → Use → End of life. Transportation is a stage in its own right, and a list that omits it is the single most common wrong answer in this exam.' },
    { id:'sdq12', topic:'t3', q:'For an electric motor running continuously for fifteen years, which life cycle stage typically dominates total impact?', a:['Raw material extraction','Manufacturing','Transportation','Use'], correct:3, explain:'For powered products with long service lives the <b>use</b> phase dominates, usually overwhelmingly. This is why efficiency almost always beats material saving for such products.' },
    { id:'sdq13', topic:'t3', q:'For a simple untreated structural bracket that consumes no energy in service, which stage typically dominates?', a:['Raw material extraction','Use','End of life','Transportation'], correct:0, explain:'For passive products the burden sits in the <b>material</b> — extraction and primary processing. There is no use-phase energy to dominate.' },
    { id:'sdq14', topic:'t3', q:'A redesign reduces a pump\'s mass by 12% but lowers its efficiency by 3%. The pump runs 8,000 hours a year for 12 years. What is the most likely outcome?', a:['A clear environmental improvement, because less material is used','A likely net worsening, because the use phase dominates and efficiency was traded away','No change, because mass and efficiency effects cancel','It cannot be assessed without knowing the material'], correct:1, explain:'96,000 operating hours makes this a use-phase-dominated product. A 3% efficiency loss over that duration will normally swamp a one-off 12% material saving. <b>Establish which stage dominates before optimising.</b>' },
    { id:'sdq15', topic:'t4', q:'Which four environmental indicators does SOLIDWORKS Sustainability report?', a:['Carbon footprint, total energy consumed, air acidification, water eutrophication','Carbon footprint, water usage, toxicity, ozone depletion','Energy, waste, emissions, cost','Global warming, acid rain, smog, landfill volume'], correct:0, explain:'Exactly these four, and you should be able to name all four with their units in any order.' },
    { id:'sdq16', topic:'t4', q:'Air acidification is measured in equivalents of which substance?', a:['CO₂','SO₂','PO₄','CH₄'], correct:1, explain:'<b>Sulphur dioxide equivalent.</b> Acidification comes from SOₓ and NOₓ, expressed against SO₂. Remember: air gets acid (SO₂), water gets fed (PO₄).' },
    { id:'sdq17', topic:'t4', q:'Water eutrophication is measured in equivalents of which substance?', a:['SO₂','NO₂','PO₄ (phosphate)','CO₂'], correct:2, explain:'<b>Phosphate equivalent.</b> Nitrogen and phosphorus reaching water fertilise algae; the bloom dies and decomposition strips the dissolved oxygen, killing fish.' },
    { id:'sdq18', topic:'t4', q:'What are the units of the total energy consumed indicator?', a:['kilowatt-hours (kWh)','Megajoules (MJ)','Joules per kilogram (J/kg)','Tonnes of oil equivalent'], correct:1, explain:'Megajoules. It covers non-renewable primary energy, including the energy embedded in producing and delivering the fuel itself — not just the metered electricity.' },
    { id:'sdq19', topic:'t4', q:'A material substitution lowers carbon footprint and energy but raises water eutrophication. What is the correct interpretation?', a:['The change is an improvement because three of four indicators improved','The change is a trade-off that requires an explicit decision, not an automatic improvement','The result is an error; indicators always move together','Eutrophication can be ignored as it is the least important indicator'], correct:1, explain:'The four indicators are independent and routinely move in opposite directions. There is no built-in single score, and combining them is a <b>value judgement</b> rather than a measurement.' },
    { id:'sdq20', topic:'t4', q:'"Carbon footprint measured in CO₂ equivalent" means:', a:['The product emits only carbon dioxide','All greenhouse gases are weighted by global warming potential and expressed on a common CO₂ scale','Only the carbon content of the material is counted','Carbon dioxide from transportation only'], correct:1, explain:'Methane, nitrous oxide and other greenhouse gases are converted to the mass of CO₂ that would cause equivalent warming. It is a common scale, not a claim about which gas was emitted.' },
    { id:'sdq21', topic:'t5', q:'What is a functional unit?', a:['The mass of the product being assessed','The quantified performance of the product system, used as the reference for all inputs and outputs','The smallest indivisible component of an assembly','The unit of measurement used for the impact indicators'], correct:1, explain:'It measures <b>function delivered</b>, not the object. "Containing 300 ml of liquid once" is a functional unit; "one cup" is not.' },
    { id:'sdq22', topic:'t5', q:'Which is the best functional unit for comparing a reusable and a disposable coffee cup?', a:['One cup','One kilogram of cup material','Delivering 350 ml of hot drink on 1,000 occasions','One year of production'], correct:2, explain:'Only a unit expressing <b>service, quantity and duration</b> makes the two systems comparable. Compared per item, a reusable cup always loses; compared per use over its life, it usually wins.' },
    { id:'sdq23', topic:'t5', q:'Two LCAs of the same product reach opposite conclusions. What is the most likely explanation?', a:['One of them contains fraudulent data','They used different functional units or system boundaries','LCA results are inherently random','One used metric and the other imperial units'], correct:1, explain:'Scope decisions are where nearly all disagreement lives. This is why ISO 14040/14044 require the goal, functional unit and boundary to be stated explicitly.' },
    { id:'sdq24', topic:'t5', q:'What do cut-off criteria specify in an LCA?', a:['The date after which data is no longer valid','The threshold below which a flow is excluded from the study','The maximum acceptable impact before a design is rejected','The point at which the product is cut from stock'], correct:1, explain:'Cut-off criteria state the threshold — by mass, energy or environmental relevance — under which an input or output is left out. They must be declared so the study can be reviewed.' },
    { id:'sdq25', topic:'t5', q:'Excluding the use phase from an assessment means that its impact is:', a:['Zero','Unknown','Averaged automatically','Assigned to the manufacturing stage'], correct:1, explain:'A boundary decision never makes an impact zero — it makes it <b>unaccounted for</b>. Omitting the use phase of a powered product usually omits most of the answer.' },
    { id:'sdq26', topic:'t6', q:'Which standards define LCA principles and requirements?', a:['ISO 9001 and ISO 14001','ISO 14040 and ISO 14044','ISO 26000 and ISO 50001','ISO 14020 and ISO 14006'], correct:1, explain:'<b>ISO 14040</b> gives principles and framework; <b>ISO 14044</b> gives requirements and guidelines. ISO 14001 is an environmental <i>management system</i> — a different thing entirely.' },
    { id:'sdq27', topic:'t6', q:'What are the four phases of an LCA, in order?', a:['Goal and scope, inventory analysis, impact assessment, interpretation','Planning, measurement, reporting, review','Design, manufacture, use, disposal','Screening, modelling, validation, publication'], correct:0, explain:'Goal & scope → LCI → LCIA → Interpretation. Interpretation also runs alongside the other three; the ISO framework diagram has arrows in both directions.' },
    { id:'sdq28', topic:'t6', q:'What happens during the inventory analysis (LCI) phase?', a:['Impacts are grouped into categories such as acidification','Every input and output flow — energy, materials, emissions, waste — is compiled','The goal of the study is agreed with the client','Conclusions and recommendations are drawn'], correct:1, explain:'LCI is the data-gathering phase: the complete flow inventory. Translating those flows into impact categories is the separate <b>LCIA</b> phase.' },
    { id:'sdq29', topic:'t6', q:'SOLIDWORKS Sustainability is best described as which kind of tool?', a:['A full, ISO 14044-compliant LCA tool suitable for certification','A screening-level LCA tool for fast design-stage comparison','A regulatory compliance database','A carbon accounting system for corporate reporting'], correct:1, explain:'It is a <b>screening</b> tool built on a commercial LCA database, designed for comparing alternatives while the design is still cheap to change. It is directional, not a certifiable full LCA.' },
    { id:'sdq30', topic:'t6', q:'Why does the geographic region matter so much in an assessment?', a:['Because shipping distance is the largest impact','Because electricity grid mix, and therefore the impact per kWh, varies enormously by region','Because environmental regulations differ by country','Because material prices vary by region'], correct:1, explain:'The same part made or used on a coal-heavy grid versus a hydro-heavy grid has very different carbon and energy figures. This is why the tool asks for manufacturing region <i>and</i> use region separately.' },
    { id:'sdq31', topic:'t6', q:'What is the purpose of a sensitivity analysis?', a:['To test whether a conclusion survives plausible changes in assumptions','To measure how sensitive a material is to temperature','To identify the most expensive component','To check the model for geometry errors'], correct:0, explain:'If the conclusion flips when a reasonable assumption is varied, it is not a conclusion. Sensitivity analysis belongs to the <b>interpretation</b> phase.' },
    { id:'sdq32', topic:'t7', q:'Which of these can full SOLIDWORKS Sustainability do that Sustainability Xpress cannot? (Select all that apply.)', a:['Assess assemblies','Model the use phase','Report the four environmental indicators','Assess configurations'], correct:[0,1,3], multi:true, explain:'Xpress is <b>parts only</b>, with no use-phase modelling and a limited material set. Both report the same four indicators — that is the option that does not belong.' },
    { id:'sdq33', topic:'t7', q:'Which inputs must you supply before SOLIDWORKS Sustainability can calculate a result? (Select all that apply.)', a:['Material','Manufacturing region','Use region','Transportation and end-of-life split'], correct:[0,1,2,3], multi:true, explain:'All four. Manufacturing region sets the factory\'s grid; use region sets the in-service grid; transportation and end-of-life complete the life cycle.' },
    { id:'sdq34', topic:'t7', q:'What does Set Baseline do?', a:['Resets the model to its default material','Stores the current design so that subsequent changes are reported as a comparison against it','Sets the minimum acceptable environmental performance','Locks the assessment so it cannot be edited'], correct:1, explain:'The baseline is what turns a number into a decision — the dashboard then shows each indicator as better or worse than the stored design. This is the intended workflow.' },
    { id:'sdq35', topic:'t7', q:'What does the Find Similar function search for?', a:['Parts with similar geometry in the design library','Materials with comparable mechanical properties but lower environmental impact','Suppliers in the same geographic region','Other products with a similar carbon footprint'], correct:1, explain:'It filters the material database on engineering properties you select and surfaces lower-impact candidates. It does not know your application — qualifying the candidate remains your job.' },
    { id:'sdq36', topic:'t7', q:'What does the Financial Impact output provide?', a:['A certified cost of compliance','An indicative cost estimate so the economic leg can be weighed alongside the environmental one','The carbon price of the product','The resale value at end of life'], correct:1, explain:'It gives an indicative cost, supporting the triple-bottom-line idea that environmental and economic performance should be seen together rather than sequentially.' },
    { id:'sdq37', topic:'t7', q:'Which statement about the Sustainability dashboard is correct?', a:['It produces a single combined environmental score','It breaks each indicator down by life cycle stage','It shows only the manufacturing impact','It requires a full LCA to be completed first'], correct:1, explain:'The stage-by-stage breakdown is the insight: it tells you <b>which stage owns the impact</b>, and therefore where a design change can actually do something.' },
    { id:'sdq38', topic:'t2', q:'Which design decisions support Design for Disassembly? (Select all that apply.)', a:['Reducing the number and variety of fasteners','Bonding dissimilar materials with structural adhesive','Marking polymer parts with their material identification','Making high-value components easy to access'], correct:[0,2,3], multi:true, explain:'Structural adhesive between dissimilar materials is the opposite of DfD — it makes separation destructive, which is precisely what you are trying to avoid.' },
    { id:'sdq39', topic:'t1', q:'Which of the following is NOT part of the triple bottom line?', a:['Environment','Society','Economy','Technology'], correct:3, explain:'Technology is a means, not one of the three dimensions. The three are environment, society and economy.' },
    { id:'sdq40', topic:'t3', q:'In which life cycle stage does the energy used to move finished goods to a distributor belong?', a:['Manufacturing','Transportation','Use','End of life'], correct:1, explain:'Transportation covers every movement — inbound raw material, inter-factory movement and distribution to market — and it is its own stage, not part of manufacturing.' },
    { id:'sdq41', topic:'t6', q:'Which statement about LCA results is most accurate?', a:['They predict actual damage to a specific ecosystem','They express potential impacts relative to a functional unit','They are legally binding under ISO 14040','They replace the need for regulatory environmental assessment'], correct:1, explain:'LCA is comparative and relative — it reports <b>potential</b> impact per functional unit. It is not a site-specific risk or environmental impact assessment.' },
    { id:'sdq42', topic:'t7', q:'A part is manufactured in one country and used in another. Why does the tool ask for both regions?', a:['To calculate import duty','Because the manufacturing grid and the in-service grid have different energy mixes','To determine the correct language for the report','Because material availability differs by region'], correct:1, explain:'Manufacturing region drives the factory\'s electricity mix; use region drives the in-service electricity mix. For a powered product the second usually matters far more.' },
    { id:'sdq43', topic:'t2', q:'Dematerialization means:', a:['Delivering the same function using less material','Removing all metal from a design','Converting a physical product into a digital service','Reducing packaging only'], correct:0, explain:'Same function, less material. Converting a product to a service is a related but distinct strategy, and packaging is only one place to apply it.' },
    { id:'sdq44', topic:'t5', q:'Which items belong in the scope definition of an assessment? (Select all that apply.)', a:['System boundary','Functional unit','Data quality requirements','Assumptions and limitations'], correct:[0,1,2,3], multi:true, explain:'All four. Scope is everything that determines what will be counted and how far the conclusions can be pushed.' },
    { id:'sdq45', topic:'t6', q:'A screening-level assessment is best used to:', a:['Support a certified environmental product declaration','Identify hot spots and rank design alternatives early','Satisfy a legal reporting obligation','Replace supplier primary data collection'], correct:1, explain:'Screening tells you <b>where</b> to act and which option is better, quickly and cheaply, at the design stage. Certification and legal reporting need a full, reviewed study.' }
  ]
};
