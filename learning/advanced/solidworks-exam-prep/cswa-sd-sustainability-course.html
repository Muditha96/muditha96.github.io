  .card { background: #243532; border-radius: 18px; padding: 28px; border: 1px solid #2f4641; }
  .btn { background: #7DAB87; color: #14201D; border: none; padding: 14px 22px; border-radius: 12px; font-family: inherit; font-size: 1em; font-weight: 700; cursor: pointer; transition: all .15s; }

  .quiz-option.correct { border-color: #8BC082; background: #2a4a36; }

    { id: 'l4-3', title: 'Air Acidification',

        "The damage is visible and serious: acid rain harms forests, acidifies lakes and kills aquatic life, corrodes buildings and monuments, and the same emissions worsen respiratory health. The dominant source is the combustion of fossil fuels, in both manufacturing and the use stage.",
        "Exam essentials: units are kg SO2-equivalent, the cause is mainly fossil-fuel combustion, and the effect is acid rain damaging ecosystems and infrastructure."

      hook: { label: 'Memory Hook', text: "Air + Acid = trees die, statues melt. Measured in kg SO2-equivalent." },
      key: ["Units: kg SO2-equivalent", "Main source: combustion of fossil fuels (SO2, NOx)", "Causes acid rain, damaging ecosystems and infrastructure", "Also linked to respiratory health problems"] },
    { id: 'l4-4', title: 'Water Eutrophication',

        "The mechanism is the killer detail: excess nutrients feed algal blooms; when the algae die and decompose, the process consumes the dissolved oxygen in the water, suffocating fish and other aquatic life and creating 'dead zones.' Main sources are fertilizers, sewage, and industrial run-off.",
        "Exam essentials: units are kg PO4-equivalent, the cause is nutrient (phosphate/nitrate) pollution, and the effect is algal blooms leading to oxygen depletion."

      key: ["Units: kg PO4-equivalent (phosphate)", "Main sources: fertilizers, sewage, industrial run-off", "Causes algal blooms -> oxygen depletion -> dead zones", "Damages fisheries and drinking water"] },
    { id: 'l4-5', title: 'Total Energy & Midpoint vs Endpoint',
      lecture: [
        "Total Energy Consumption is the sum of all energy used across the life cycle, measured in megajoules (MJ). It counts non-renewable and renewable sources alike, and includes the 'embodied energy' already locked inside raw materials before you ever touch them. Lower is always better.",
        "A deeper assessment idea the exam may probe is the difference between midpoint and endpoint impacts. An endpoint (or 'damage') effect is what we ultimately care about -- for example, the actual rise in global average temperature, or harm to human health. But endpoints are extremely hard to attribute to one product. So most methods measure the MIDPOINT instead: a measurable proxy earlier in the cause-and-effect chain, such as the mass of greenhouse gases emitted, which is known to lead to warming.",
        "Exam essentials: energy is measured in MJ; most impact-assessment methodologies report MIDPOINT indicators because endpoint damage is so difficult to measure directly."
      ],
      hook: { label: 'Memory Hook', text: "Energy = MJ. Midpoint = the measurable proxy (GHGs emitted); Endpoint = the real damage (degrees of warming) -- harder to measure, so we use midpoints." },
      key: ["Total Energy Consumption -- megajoules (MJ)", "Counts renewable + non-renewable + embodied energy", "Midpoint = measurable proxy (e.g., GHG mass); Endpoint = actual damage", "Most methods use MIDPOINT indicators"] },

  t5: [
    { id: 'l5-1', title: 'The Assessment Spectrum',
      lecture: [
        "Environmental assessment is not a single tool but a spectrum of rigor, and the guide presents it that way under the heading 'Putting It All Together.' At the simplest end is intuition -- an experienced designer's gut feel. Next come product scorecards and conceptual life-cycle thinking: quick, structured ways to flag obvious issues without heavy data.",
        "Further along is qualitative LCA, then life-cycle-based design assessment (the category SOLIDWORKS Sustainability falls into), and finally a full, formal Life Cycle Assessment with detailed inventory data. As you move along the spectrum, accuracy and confidence rise, but so do the time, cost, and data required.",
        "The practical skill the exam wants is choosing the right level for the decision at hand. A quick screening-level tool is perfect for comparing two design options early on; a full LCA is reserved for high-stakes or public claims. Match the rigor of the method to the importance of the decision."
      ],
      hook: { label: 'Memory Hook', text: "Rigor is a dial: intuition -> scorecards -> qualitative -> design-level (SOLIDWORKS) -> full LCA. More rigor = more time, cost, and confidence." },
      key: ["Assessment ranges from intuition to a full formal LCA", "Steps: intuition, scorecards, conceptual thinking, qualitative LCA, design-level, full LCA", "More rigor = more accuracy but more time, cost, and data", "Match the method's rigor to the importance of the decision"] },
    { id: 'l5-2', title: 'Screening-Level vs Full LCA',
      lecture: [
        "A screening-level assessment, such as the one SOLIDWORKS Sustainability performs, is fast and uses built-in average data to estimate impacts and compare design options. It is ideal for guiding design decisions: you can quickly see whether switching a material or shedding mass moves the numbers in the right direction.",
        "A full LCA is the rigorous, standards-based study (ISO 14040/14044) with detailed, product-specific inventory data, peer review, and defensible results. It costs far more time and money. The exam's key rule: if you found a greener option with a screening tool and now want to make a MARKETING claim about it, you must verify the result with a full LCA. A screening estimate is enough to guide design, but not to make a public environmental claim.",
        "This is also the link back to greenwashing: making marketing claims on screening-level data alone is exactly how well-meaning designers greenwash by accident."

      hook: { label: 'Memory Hook', text: "Screening LCA = good enough to DESIGN. Full LCA = required to MARKET a claim." },
      key: ["Screening-level LCA: fast, average data, great for comparing design options", "Full LCA: rigorous, product-specific, standards-based, costly", "To make a marketing claim, verify a screening result with a FULL LCA", "Marketing on screening data alone risks greenwashing"] },
    { id: 'l5-3', title: 'Qualitative Tools & Initial Decisions',
      lecture: [
        "Before any numbers, every assessment requires initial decisions that shape everything after: which impacts you care about, and how far up and down the life cycle you will look. These early choices -- the impacts of interest and the extent of the study -- are what the guide calls 'making theory matter.'",
        "Qualitative tools support these early decisions. A product scorecard lists relevant environmental attributes and rates them, surfacing obvious problems cheaply. Conceptual life-cycle thinking walks each stage and asks where the big impacts likely sit, without precise data. These tools will not give you exact kilograms of CO2, but they reliably point you toward the hotspots worth measuring.",
        "Exam takeaway: assessment starts with deciding which impacts and what scope to consider; qualitative tools (scorecards, conceptual thinking) help make those initial decisions before committing to detailed measurement."

  ],
  t6: [
    { id: 'l6-1', title: 'What LCA Is (and ISO Standards)',
      lecture: [
        "Life Cycle Assessment (LCA) is the formal, scientific method for evaluating the environmental impacts of a product at each stage of its life and overall. It is the engine beneath SOLIDWORKS Sustainability and the gold standard the whole field references.",
        "Crucially, an LCA is only useful for COMPARISON. A single impact number means little on its own; it gains meaning when compared against a previous version, a competitor, an alternative design, an industry benchmark, or a target. Keep this in mind -- the exam often frames LCA results as comparisons.",
        "The governing standards are ISO 14040 (principles and framework) and ISO 14044 (requirements and guidelines). A related standard, ISO 14067, covers the carbon footprint of products specifically. Recognize these numbers."
      ],
      hook: { label: 'Number Hook', text: "ISO 14040 + 14044 = LCA. ISO 14067 = product carbon footprint. LCA is only useful for COMPARISON." },
      key: ["LCA quantifies environmental impact at each life stage and overall", "Only meaningful as a COMPARISON (vs previous, competitor, alternative, benchmark, target)", "ISO 14040 = principles & framework; ISO 14044 = requirements", "ISO 14067 = carbon footprint of products"],
      extra: EXTRA_TEMPLATES.lcaFramework },
    { id: 'l6-2', title: 'Phase 1 -- Goal & Scope (Functional Unit & System Boundary)',
      lecture: [
        "Every LCA opens by defining its Goal and Scope, and this phase contains two concepts the exam explicitly says you must understand: the functional unit and the system boundary.",
        "The FUNCTIONAL UNIT is the quantified basis of comparison -- the 'job' the product does, expressed so that alternatives can be compared fairly. You do not compare 'one light bulb to another'; you compare them per a function such as '1,000 hours of light at a given brightness.' Without a functional unit, comparisons are meaningless, because two products may not deliver the same service.",
        "The SYSTEM BOUNDARY defines what is included in and excluded from the study -- how far up and down the life cycle you look. A cradle-to-gate boundary stops at the factory gate; cradle-to-grave continues through use and disposal. Choosing the boundary is a judgement call that strongly affects the result, so it must be stated clearly. Goal and scope, including these two variables, frame the entire study."
      ],
      hook: { label: 'Memory Hook', text: "Functional unit = the fair basis of comparison ('1000 hours of light'). System boundary = what's in vs out (cradle-to-gate vs cradle-to-grave)." },
      key: ["Phase 1 = Goal & Scope definition", "Functional unit = quantified basis of comparison (the job done)", "System boundary = what is included/excluded; how far along the life cycle", "Both strongly shape the result and must be stated up front"],
      trap: "Functional unit and system boundary are named explicitly in the exam objectives. Expect at least one question on each -- know the difference cold." },
    { id: 'l6-3', title: 'Phase 2 -- Inventory Analysis (LCI)',
      lecture: [
        "The second phase is the Life Cycle Inventory (LCI). Here you compile a detailed list of every input and output that crosses the system boundary across all life-cycle stages: raw materials and energy in; products, co-products, emissions, and waste out.",
        "This is the data-gathering phase, and it is typically the most laborious part of a full LCA, because it requires real quantities for every flow. In a screening tool like SOLIDWORKS Sustainability, this inventory comes pre-built from a database (such as GaBi), which is exactly why screening tools are fast.",
        "Exam essentials: the inventory analysis lists all inputs and outputs (energy and materials in, emissions and waste out) for the defined system. It feeds the next phase, impact assessment."
      ],
      hook: { label: 'Memory Hook', text: "Inventory = the big shopping list: everything IN (energy, materials) and everything OUT (emissions, waste)." },
      key: ["Phase 2 = Life Cycle Inventory (LCI)", "Lists all inputs and outputs crossing the system boundary", "Inputs: materials, energy; Outputs: emissions, waste, products", "Most labour-intensive phase of a full LCA; pre-built in screening tools"] },
    { id: 'l6-4', title: 'Phase 3 -- Impact Assessment (LCIA)',
      lecture: [
        "The third phase, Life Cycle Impact Assessment (LCIA), translates the raw inventory list into meaningful environmental impacts. Two steps are always done: classification, which sorts each emission into the impact categories it contributes to (CO2 and methane to climate change; SO2 to acidification), and characterization, which converts everything within a category into a common unit using equivalency factors (all greenhouse gases into kg CO2-equivalent).",
        "Two further steps are OPTIONAL: normalization and weighting. Normalization expresses a product's impact relative to a reference, such as the average per-person impact in a region, so you can see whether a number is large or small in context. Weighting then combines the different categories into a single overall score.",
        "Exam essentials: classification and characterization are the mandatory LCIA steps; normalization and weighting are optional. The next lesson examines why weighting is the controversial one."
      ],
      hook: { label: 'Memory Hook', text: "LCIA steps: Classify -> Characterize (both required), then optionally Normalize -> Weight." },
      key: ["Phase 3 = Impact Assessment (LCIA)", "Classification: sort emissions into impact categories (required)", "Characterization: convert to common units via equivalency factors (required)", "Normalization and weighting are OPTIONAL"] },
    { id: 'l6-5', title: 'Phase 4 -- Interpretation',
      lecture: [
        "The fourth and final phase is Interpretation. Here you make sense of the results: identify the significant findings (which stages and impacts dominate), check the study for consistency and completeness, acknowledge limitations and assumptions, and draw conclusions and recommendations.",
        "Interpretation is not a rubber stamp at the end; ISO frames LCA as iterative, so interpretation often sends you back to refine the goal, scope, inventory, or assessment. It is also where you decide whether the differences you found are actually meaningful -- a topic covered in the next module.",
        "Exam essentials: interpretation draws conclusions and recommendations from the impact results, evaluates the study's reliability, and may loop back to earlier phases. The four phases in order are Goal & Scope, Inventory, Impact Assessment, Interpretation."
      ],
      hook: { label: 'Mnemonic: GI-II', text: "Goal & scope -> Inventory -> Impact assessment -> Interpretation. 'Good Idea, Investigate It.'" },
      key: ["Phase 4 = Interpretation", "Identify significant findings; check consistency and completeness", "State assumptions, limitations, conclusions, recommendations", "LCA is iterative -- interpretation can loop back to earlier phases"] },
    { id: 'l6-6', title: 'Normalization, Weighting & Single Scores',
      lecture: [
        "Decision-makers often want one number, so the optional steps can collapse many impacts into a single score, sometimes expressed in 'millipoints.' But getting there involves a step you must understand precisely for the exam: weighting.",
        "WEIGHTING combines the different impact categories into one score by deciding how important each is relative to the others. The guide is emphatic that weighting is more of a POLITICAL than a scientific process: choosing to give global warming more weight than acidification is a values-based decision, not an objective fact, and different stakeholders genuinely disagree. NORMALIZATION, by contrast, simply rescales impacts against a reference model (national or global) so their relative size is clear.",
        "Because weighting is subjective, many practitioners deliberately leave the impact scores broken out by category rather than merging them into one number. Exam trap: if an option claims weighting relies on objective science or proven scientific theory, it is WRONG -- weighting is values-based."
      ],
      hook: { label: 'Memory Hook', text: "Normalize = rescale against a reference. Weight = combine into one score, and that's POLITICAL, not scientific." },
      key: ["A single score (e.g., millipoints) merges many impacts into one number", "Normalization rescales impacts against a national/global reference", "Weighting decides relative importance -- it is values-based / political", "Many practitioners keep categories separate to avoid hidden value judgements"],
      trap: "Weighting is NOT scientific. Any answer saying weighting relies on tested scientific theory is wrong -- the guide calls it a political, values-based process." },
  ],
  t7: [
    { id: 'l7-1', title: 'So What? Results Are for Comparison',
      lecture: [
        "Once you have impact results, the guide asks the blunt question that titles its fifth chapter: 'So what?' A bundle of impact numbers means nothing in isolation, because sustainability is a relative concept. Results become useful only when compared against something.",
        "The standard comparison sets are: accepted standards or thresholds; the product's own previous versions; alternative design options you are weighing; and competitive benchmarks from rival products. Crucially, the guide stresses that the comparison set should be chosen EARLY, during goal and scope, so that the right data is gathered for the alternatives as part of the same study.",
        "Exam essentials: environmental assessment results are meaningful only as comparisons -- against standards, previous or alternative designs, competitive benchmarks, or targets -- and the comparison should be planned from the start."
      ],
      hook: { label: 'Memory Hook', text: "'So what?' A number alone says nothing. Compare against: standards, previous/alternative designs, competitor benchmarks, targets." },
      key: ["Results are meaningful only as COMPARISONS", "Compare against: standards, previous designs, alternatives, competitor benchmarks", "Choose the comparison set EARLY, during goal & scope", "Sustainability is relative, so context is everything"] },
    { id: 'l7-2', title: 'Meaningful vs Trivial Differences',
      lecture: [
        "Not every difference between two designs matters. When you compare results, you must judge whether a difference is significant -- large enough, and certain enough, to base a decision on. A 2% difference produced by a screening tool with wide error bars may be noise, not a real improvement.",
        "Significance depends on the products being compared and on the measurement approach: the more approximate the method, the larger a difference must be before you can trust it. This is why over-claiming from small differences is dangerous, and why marketing claims need the tighter certainty of a full LCA.",
        "Exam essentials: when interpreting results, decide which differences are genuinely meaningful given the method's accuracy; small differences from a screening assessment may not be reliable enough to act on or advertise."
      ],
      hook: { label: 'Memory Hook', text: "Ask 'is this difference real, or just noise?' Rougher method = bigger difference needed before you trust it." },
      key: ["Judge whether a difference is significant before acting on it", "Significance depends on the products and the measurement accuracy", "Small differences from a screening tool may be within the error margin", "Reliable certainty for claims requires a full LCA"] },
    { id: 'l7-3', title: 'Communicating Results Honestly',
      lecture: [
        "The final skill is communicating environmental results to different audiences -- engineers, executives, marketers, customers -- without overstating them. Good communication states what was measured, the functional unit and system boundary used, the comparison baseline, and the confidence level. This transparency is what separates a credible claim from greenwashing.",
        "Match the message to the audience: a designer needs the per-stage breakdown to act on; a customer needs an honest, comparative headline ('uses 30% less energy than the previous model, verified by full LCA'). Never present a screening estimate as a guaranteed fact, and never drop the context that makes a number meaningful.",
        "Exam essentials: communicate results honestly and in context, verify public claims with a full LCA, and remember that breaking impacts out by category is often clearer and more honest than collapsing them into a single weighted score."

      hook: { label: 'Memory Hook', text: "Honest communication = state what, vs what, within what boundary, how sure. Skip any of those and you're greenwashing." },
      key: ["Communicate what was measured, the baseline, the boundary, and the confidence", "Tailor detail to the audience (designer vs customer)", "Verify public/marketing claims with a full LCA", "Transparency is the opposite of greenwashing"] },

  t8: [
    { id: 'l8-1', title: 'EU Regulations & Global Reach',
      lecture: [
        "Regulations are the 'industry' leg of why engineers design sustainably, and the European Union's rules carry the most weight. The single most important fact for the exam: EU directives apply to any manufacturer that sells INTO the EU, not just those based there -- so they reach manufacturers worldwide.",
        "The second crucial point is one many candidates miss: following good sustainable-design principles does NOT automatically guarantee EU compliance. The directives target specific concerns, such as the toxicity of particular substances, with specific registration and restriction rules. A product can be thoughtfully 'green' and still violate a directive if it contains a banned substance or skips a required registration.",
        "Exam essentials: EU regulations have global reach, and sustainable design and regulatory compliance are two different things you must satisfy separately."
      ],
      hook: { label: 'Memory Hook', text: "Sell into the EU = follow EU rules, wherever you are. And 'green' does NOT equal 'compliant'." },
      key: ["EU directives apply to anyone selling into the EU -- global reach", "Sustainable design does NOT guarantee EU compliance", "Directives target specific concerns like substance toxicity", "Compliance must be checked separately from sustainability"],
      trap: "True/false favourite: 'Adhering to sustainable design principles assures EU compliance.' The answer is FALSE -- they are separate requirements." },
    { id: 'l8-2', title: 'RoHS',
      lecture: [
        "RoHS stands for the Restriction of Hazardous Substances. It places strict limits on specific hazardous materials used in electrical and electronic equipment, and it applies both to products made in the EU and to products imported into it.",
        "The originally restricted substances are lead, mercury, cadmium, hexavalent chromium, and two brominated flame retardants (PBB and PBDE); a later update added four phthalates. The most famous practical effect is the shift to lead-free solder in electronics.",
        "Exam essentials: RoHS = restriction of hazardous substances in electrical/electronic equipment; remember lead and mercury as the headline examples, and that it drove lead-free solder."
      ],
      hook: { label: 'Memory Hook', text: "RoHS = Restriction of Hazardous Substances. Targets electronics; famous for banishing lead (lead-free solder)." },
      key: ["RoHS = Restriction of Hazardous Substances", "Applies to electrical and electronic equipment", "Restricts lead, mercury, cadmium, hex chromium, PBB, PBDE (+4 phthalates)", "Drove the move to lead-free solder"] },
    { id: 'l8-3', title: 'REACH',
      lecture: [
        "REACH stands for Registration, Evaluation, Authorisation (and restriction) of Chemicals. It is the EU's broad framework for managing chemical substances, aimed at protecting human health and the environment from chemical risks.",
        "Under REACH, manufacturers and importers must register the substances they place on the EU market (generally above one tonne per year), some substances of very high concern require explicit authorisation, and the most dangerous can be restricted outright. It is far broader than RoHS, covering chemicals across all kinds of products, not just electronics.",
        "Exam essentials: REACH = Registration, Evaluation, Authorisation of Chemicals; it governs chemical substances broadly across the EU market."
      ],
      hook: { label: 'Acronym Hook', text: "REACH = Registration, Evaluation, Authorisation of CHemicals. Broad chemical control, not just electronics." },
      key: ["REACH = Registration, Evaluation, Authorisation of Chemicals", "Protects human health and the environment from chemical risk", "Manufacturers/importers must register substances they place on the market", "Broader than RoHS -- covers chemicals across all products"] },
    { id: 'l8-4', title: 'WEEE & ELV',
      lecture: [
        "WEEE and ELV are end-of-life directives, and both are Extended Producer Responsibility written into law. WEEE -- Waste Electrical and Electronic Equipment -- requires producers to take back and recycle electronic products at end-of-life, shifting the cost and duty of disposal onto the maker.",
        "ELV -- End-of-Life Vehicles -- does the same for the automotive industry, setting recycling and recovery targets and restricting hazardous materials in vehicles. Both directives push 'design for recycling' upstream into the CAD stage, because the cheapest way to meet a take-back obligation is to design a product that comes apart and recycles easily in the first place.",
        "Exam essentials: WEEE covers waste electronics, ELV covers end-of-life vehicles, and both embody Extended Producer Responsibility, reinforcing Design for Disassembly."
      ],
      hook: { label: 'Memory Hook', text: "WEEE = waste electronics (Wee Electronics). ELV = End-of-Life Vehicles. Both are EPR in legal form." },
      key: ["WEEE = Waste Electrical and Electronic Equipment (take-back & recycling)", "ELV = End-of-Life Vehicles (recycling/recovery targets)", "Both are Extended Producer Responsibility in law", "Both push Design for Disassembly upstream into design"] },
  ],

  { id: 'q19', topic: 't4', q: 'Water eutrophication is measured in, and caused by:', a: ["kg CO2-eq; carbon emissions", "kg PO4-eq; nutrient pollution causing algal blooms", "kg SO2-eq; acid rain", "MJ; energy use"], correct: 1, explain: "Eutrophication is measured in kg PO4-equivalent and is caused by nutrient pollution (phosphates/nitrates) that triggers algal blooms and oxygen depletion." },
  { id: 'q20', topic: 't4', q: 'Total energy consumption is measured in:', a: ["Kilowatts", "Megajoules (MJ)", "kg CO2-equivalent", "Newtons"], correct: 1, explain: "Total energy consumption is measured in megajoules (MJ), counting renewable, non-renewable, and embodied energy." },
  { id: 'q21', topic: 't4', q: 'Most impact-assessment methods measure MIDPOINT indicators because:', a: ["Endpoint damage effects are difficult to measure directly", "Midpoints are required by EU law", "Endpoints do not matter", "Midpoints are always more accurate"], correct: 0, explain: "Endpoint (damage) effects like actual temperature rise are very hard to attribute to one product, so methods use measurable midpoint proxies such as the mass of greenhouse gases emitted." },
  { id: 'q22', topic: 't5', q: 'Environmental assessment methods range across a spectrum of:', a: ["Cost only", "Rigor -- from intuition to a full formal LCA", "Colour-coding", "Software brands"], correct: 1, explain: "Assessment ranges from intuition and scorecards through qualitative methods to a full LCA; more rigor brings more accuracy at more time and cost." },
  { id: 'q23', topic: 't5', q: 'You found a greener option using a screening-level tool and want to advertise it. You should:', a: ["Publish the screening result as-is", "Verify the result with a full LCA before making the marketing claim", "Use intuition to confirm it", "Skip verification since screening is enough"], correct: 1, explain: "Screening data is fine to guide design, but a marketing claim must be verified with a full LCA; otherwise you risk greenwashing." },
  { id: 'q24', topic: 't5', q: 'Before measuring anything, which initial assessment decisions are required? Select all that apply.', a: ["Which impact categories to focus on", "The scope or life-cycle boundary", "The marketing slogan", "The product colour"], correct: [0, 1], explain: "Early decisions about which impacts matter and how far up/down the life cycle to assess shape the entire study." },
  { id: 'q25', topic: 't6', q: 'A Life Cycle Assessment is only truly useful when used to:', a: ["Generate a single absolute score", "Compare options (previous versions, alternatives, competitors, benchmarks)", "Replace all testing", "Set the product price"], correct: 1, explain: "LCA results are meaningful only as comparisons, since sustainability is a relative concept." },
  { id: 'q26', topic: 't6', q: 'Which ISO standards define LCA principles and requirements? Select all that apply.', a: ["ISO 14040", "ISO 14044", "ISO 9001", "ISO 26000"], correct: [0, 1], explain: "ISO 14040 covers LCA principles and framework; ISO 14044 covers requirements and guidelines. (ISO 14067 specifically covers product carbon footprint.)" },
  { id: 'q27', topic: 't6', q: 'In LCA goal and scope, the FUNCTIONAL UNIT is:', a: ["The factory that makes the product", "The quantified basis of comparison (the job the product performs)", "The heaviest component", "The software license type"], correct: 1, explain: "The functional unit is the quantified service basis (e.g., '1000 hours of light') that lets alternatives be compared fairly." },
  { id: 'q28', topic: 't6', q: 'The SYSTEM BOUNDARY of an LCA defines:', a: ["The legal liability of the producer", "What is included in and excluded from the study (how far along the life cycle)", "The maximum file size", "The product warranty period"], correct: 1, explain: "The system boundary sets what the study includes/excludes -- for example cradle-to-gate versus cradle-to-grave." },
  { id: 'q29', topic: 't6', q: 'Which Life Cycle Impact Assessment (LCIA) steps are mandatory? Select all that apply.', a: ["Classification", "Characterization", "Normalization", "Weighting"], correct: [0, 1], explain: "Classification (sorting emissions into categories) and characterization (converting to common units) are required; normalization and weighting are optional." },
  { id: 'q30', topic: 't6', q: 'In LCA, weighting (combining impacts into one score) is best described as:', a: ["A purely objective scientific calculation", "More of a political, values-based process", "A required ISO step", "Identical to characterization"], correct: 1, explain: "The guide states weighting is more political than scientific: deciding that one impact matters more than another is a values-based judgement, and stakeholders disagree." },
  { id: 'q31', topic: 't6', q: 'Normalization in LCA does what?', a: ["Combines impacts into a single weighted score", "Rescales a product's impacts against a reference model (national/global) to show relative size", "Sorts emissions into categories", "Lists all inputs and outputs"], correct: 1, explain: "Normalization expresses impacts relative to a reference (such as average per-person impact) so you can judge whether a value is large or small in context." },
  { id: 'q32', topic: 't6', q: 'What are the four phases of an LCA, in order?', a: ["Inventory, Goal, Interpretation, Impact", "Goal & Scope, Inventory Analysis, Impact Assessment, Interpretation", "Classification, Characterization, Normalization, Weighting", "Design, Make, Use, Dispose"], correct: 1, explain: "The four phases are Goal & Scope, Inventory Analysis (LCI), Impact Assessment (LCIA), and Interpretation." },
  { id: 'q33', topic: 't7', q: 'Results from a product environmental assessment can be compared to:', a: ["Only the current design", "Standards, previous or alternative designs, and competitive benchmarks", "Only competitor prices", "Nothing -- they are absolute"], correct: 1, explain: "Comparisons can be made against standards, previous/alternative designs, competitive benchmarks, and targets -- chosen early in the process." },

  { id: 'q36', topic: 't8', q: 'EU directives such as RoHS affect:', a: ["Only companies located in the EU", "Manufacturers worldwide who sell into the EU", "Only electronics retailers", "Only raw-material suppliers"], correct: 1, explain: "EU directives apply to products made in OR imported into the EU, so they impact manufacturers worldwide." },

const STORE_KEY = 'cswa-sd-lecture-progress-v1';
const FONT_KEY = 'cswa-sd-lecture-font-v1';
const EXAM_QUESTION_COUNT = 30;
const EXAM_PASS_SCORE = 24;
const EXAM_TIME_LIMIT_MS = 60 * 60 * 1000;

function emptyProgress() { return { learned: {}, answered: {}, wrongQueue: [] }; }
function emptyExam() { return { active: false, complete: false, questions: [], answers: {}, startedAt: null, endsAt: null, expired: false }; }
function normalizeProgress(progress) {
  const base = emptyProgress();
  if (!progress || typeof progress !== 'object') return base;
  return {
    learned: progress.learned && typeof progress.learned === 'object' ? progress.learned : {},
    answered: progress.answered && typeof progress.answered === 'object' ? progress.answered : {},
    wrongQueue: Array.isArray(progress.wrongQueue) ? progress.wrongQueue : []
  };
}
function loadProgress() { try { const v = localStorage.getItem(STORE_KEY); return v ? normalizeProgress(JSON.parse(v)) : emptyProgress(); } catch { return emptyProgress(); } }
function saveProgress() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state.progress)); } catch {} }
function loadFont() { try { const v = localStorage.getItem(FONT_KEY); return v ? parseInt(v, 10) : 18; } catch { return 18; } }
function saveFont() { try { localStorage.setItem(FONT_KEY, String(state.fontSize)); } catch {} }

const state = { view: 'home', topicId: null, cardIdx: 0, quizMode: 'all', quizIdx: 0, quizAnswer: null, quizSelection: [], showSettings: false, fontSize: 18, progress: emptyProgress(), exam: emptyExam() };

function applyFont() { document.body.classList.remove('fs-14','fs-16','fs-18','fs-20','fs-22','fs-24','fs-26','fs-28'); document.body.classList.add('fs-' + state.fontSize); }
function quizPool() { if (state.quizMode === 'review') return QUESTIONS.filter(q => state.progress.wrongQueue.includes(q.id)); if (state.quizMode === 'all') return QUESTIONS; return QUESTIONS.filter(q => q.topic === state.quizMode); }
function currentQuizPool() { if (!state.exam.active) return quizPool(); return state.exam.questions.map(id => QUESTIONS.find(q => q.id === id)).filter(Boolean); }
function currentQuestion() { const pool = currentQuizPool(); return pool[Math.min(state.quizIdx, pool.length - 1)]; }
function correctAnswers(q) { return Array.isArray(q.correct) ? q.correct.slice().sort((a, b) => a - b) : [q.correct]; }
function isMultiQuestion(q) { return correctAnswers(q).length > 1; }
function sameAnswerSet(a, b) { const aa = (a || []).slice().sort((x, y) => x - y); const bb = (b || []).slice().sort((x, y) => x - y); return aa.length === bb.length && aa.every((v, i) => v === bb[i]); }
function answerText(q, answer) { return (answer || []).map(i => q.a[i]).filter(Boolean).join(', '); }
function shuffleCopy(items) {
  const out = items.slice();
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}
function startExamSession() {
  const questions = shuffleCopy(QUESTIONS).slice(0, Math.min(EXAM_QUESTION_COUNT, QUESTIONS.length)).map(q => q.id);
  const now = Date.now();
  return { active: true, complete: false, questions, answers: {}, startedAt: now, endsAt: now + EXAM_TIME_LIMIT_MS, expired: false };
}
function examTimeRemainingMs() { return state.exam.endsAt ? Math.max(0, state.exam.endsAt - Date.now()) : EXAM_TIME_LIMIT_MS; }
function formatTime(ms) { const total = Math.ceil(ms / 1000); const m = Math.floor(total / 60); const s = total % 60; return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
function updateTimerBadge() { const el = document.getElementById('timerBadge'); if (el) el.textContent = 'Time left ' + formatTime(examTimeRemainingMs()); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;'); }

    '<div class="display" style="font-size:2.4em;font-weight:700;margin-bottom:4px">' + correctCount + ' / ' + pool.length + '</div>' +
    '<p class="subtle" style="margin:0 0 18px">Score: ' + scorePct + '% · Pass target: ' + EXAM_PASS_SCORE + ' / ' + EXAM_QUESTION_COUNT + (state.exam.expired ? ' · Time expired' : '') + '</p>' +
    '<div class="progress-bar" style="margin:0 auto 22px;max-width:360px"><div class="progress-fill" style="width:' + scorePct + '%;background:' + (passed ? '#7DAB87' : '#D9A574') + '"></div></div>' +
    '<div class="nav-row" style="justify-content:center;margin-top:0"><button class="btn" onclick="startExam()">Retake 30-question exam</button><button class="nav-btn" onclick="openReview()">Review wrong answers</button><button class="nav-btn" onclick="openQuiz()">Practice bank</button></div></div>';

  if (missed.length > 0) {
    html += '<h2 class="display" style="margin:28px 0 12px">Questions to review</h2><div class="result-list">';
    missed.forEach(q => {
      const given = state.exam.answers[q.id] ? answerText(q, state.exam.answers[q.id].answer) : 'No answer';
      html += '<div class="result-item"><div style="font-weight:700;margin-bottom:6px">' + esc(q.q) + '</div>' +
        '<div class="subtle" style="font-size:0.92em">Your answer: ' + esc(given) + '</div>' +
        '<div style="margin-top:6px">Correct: ' + esc(answerText(q, correctAnswers(q))) + '</div>' +
        '<div class="subtle" style="margin-top:6px;font-size:0.92em">' + esc(q.explain) + '</div></div>';
    });
    html += '</div>';
  }
  return html;
}
function renderQuiz() {
  if (state.exam.active && state.exam.complete) return renderExamResult();
  const pool = currentQuizPool();
  if (pool.length === 0) {
    return '<div class="card" style="text-align:center;padding:48px">' + icon('trophy', 48, '#7DAB87') +
      '<h2 class="display" style="margin:14px 0 10px">' + (state.quizMode === 'review' ? 'Nothing to review' : 'No questions yet') + '</h2>' +
      '<p class="subtle" style="margin-bottom:20px">' + (state.quizMode === 'review' ? "You've cleared every wrong answer -- take the exam again to stay sharp." : 'Pick a module to start.') + '</p>' +
      '<button class="btn" onclick="startExam()">Start 30-question exam</button></div>';
  }
  const q = currentQuestion();
  const topicOfQ = TOPICS.find(t => t.id === q.topic);
  const isExam = state.exam.active && !state.exam.complete;
  const modeLabel = isExam ? 'Timed Exam' : state.quizMode === 'review' ? 'Review Mode' : state.quizMode === 'all' ? 'Practice Bank' : topicOfQ.title;
  const correct = correctAnswers(q);
  const isMulti = isMultiQuestion(q);
  const answerLocked = state.quizAnswer !== null;

  let optsHtml = '';
  q.a.forEach((opt, i) => {
    let cls = 'quiz-option';
    const selectedNow = state.quizSelection.includes(i);
    const selectedFinal = answerLocked && state.quizAnswer.includes(i);
    if (answerLocked && isExam) { if (selectedFinal) cls += ' selected'; }
    else if (answerLocked) { if (correct.includes(i)) cls += ' correct'; else if (selectedFinal) cls += ' wrong'; }
    else if (selectedNow) cls += ' selected';
    optsHtml += '<button class="' + cls + '" ' + (answerLocked ? 'disabled' : '') + ' onclick="chooseQuizOption(' + i + ')">' +
      '<span style="font-weight:700;margin-right:10px;color:' + (!answerLocked ? '#7DAB87' : 'inherit') + '">' + String.fromCharCode(65 + i) + '.</span>' + esc(opt) +
      (answerLocked && !isExam && correct.includes(i) ? '<span style="float:right">' + icon('check', 20, '#8BC082') + '</span>' : '') +
      (answerLocked && !isExam && selectedFinal && !correct.includes(i) ? '<span style="float:right">' + icon('xCircle', 20, '#C97A7A') + '</span>' : '') + '</button>';
  });

  let selectOpts = '<option value="all"' + (state.quizMode === 'all' ? ' selected' : '') + '>All practice questions</option><option value="review"' + (state.quizMode === 'review' ? ' selected' : '') + '>Review wrong</option>';
  TOPICS.forEach(t => { selectOpts += '<option value="' + t.id + '"' + (state.quizMode === t.id ? ' selected' : '') + '>' + esc(t.title) + '</option>'; });

  let html = '<div class="quiz-meta">' +
    '<span class="badge">' + icon(isExam ? 'award' : 'target', 14) + esc(modeLabel) + '</span>' +
    '<span class="badge subtle">Q ' + (state.quizIdx + 1) + ' of ' + pool.length + '</span>' +
    (isExam ? '<span id="timerBadge" class="badge">Time left ' + formatTime(examTimeRemainingMs()) + '</span><button class="nav-btn" onclick="finishExam(false)">Finish exam</button>' : '<button class="nav-btn" onclick="startExam()">Start exam mode</button><div style="margin-left:auto"><select onchange="changeQuizMode(this.value)">' + selectOpts + '</select></div>') + '</div>';
  html += '<div class="card"><div class="display" style="font-size:1.25em;font-weight:700;margin-bottom:10px;line-height:1.45">' + esc(q.q) + '</div>' +
    '<div class="subtle" style="font-size:0.92em;margin-bottom:18px">' + (isMulti ? 'Select all that apply, then check your answer.' : 'Choose one answer.') + '</div><div>' + optsHtml + '</div>';
  if (answerLocked && !isExam) {
    const isCorrect = sameAnswerSet(state.quizAnswer, correct);
    html += '<div class="hook-box" style="border-left-color:' + (isCorrect ? '#8BC082' : '#C97A7A') + '">' +
      '<div class="row" style="margin-bottom:6px;gap:8px">' + (isCorrect ? icon('check', 18, '#8BC082') : icon('lightbulb', 18, '#D9A574')) +
      '<strong style="color:' + (isCorrect ? '#8BC082' : '#D9A574') + ';font-size:0.9em;letter-spacing:0.05em;text-transform:uppercase">' + (isCorrect ? 'Correct' : 'Explanation') + '</strong></div><div>' + esc(q.explain) + '</div></div>';
  }
  if (answerLocked && isExam) {
    html += '<div class="hook-box"><div class="row" style="gap:8px">' + icon('check', 18, '#7DAB87') + '<strong>Answer saved</strong></div><div class="subtle" style="margin-top:6px">Explanations are shown after you finish the exam.</div></div>';
  }
  html += '<div class="nav-row"><button class="nav-btn" ' + (state.quizIdx === 0 ? 'disabled' : '') + ' onclick="prevQuiz()">' + icon('chevronLeft', 18) + ' Previous</button>';
  if (!answerLocked && isMulti) html += '<button class="btn" ' + (state.quizSelection.length === 0 ? 'disabled' : '') + ' onclick="submitQuizAnswer()">Check answer</button>';
  else if (answerLocked && state.quizIdx < pool.length - 1) html += '<button class="btn" onclick="nextQuiz()">Next question ' + icon('chevronRight', 18) + '</button>';
  else if (answerLocked && state.quizIdx === pool.length - 1 && isExam) html += '<button class="btn" onclick="finishExam(false)">Finish exam</button>';
  else if (answerLocked && state.quizIdx === pool.length - 1) html += '<button class="btn" onclick="restartQuiz()">' + icon('refresh', 18) + ' Start over</button>';
  else html += '<span class="subtle" style="font-size:0.92em">Answer to continue.</span>';
  html += '</div></div><div class="progress-bar" style="margin-top:20px"><div class="progress-fill" style="width:' + ((state.quizIdx + 1) / pool.length * 100) + '%"></div></div>';
  return html;
}
function renderSettings() {
  if (!state.showSettings) return '';
  return '<div class="modal-bg" onclick="toggleSettings()"><div class="modal" onclick="event.stopPropagation()">' +
    '<div class="row-between" style="margin-bottom:20px"><h2 class="display" style="font-size:1.4em">Display &amp; Reset</h2><button class="nav-btn" onclick="toggleSettings()">Close</button></div>' +
    '<div style="margin-bottom:24px"><div class="row" style="margin-bottom:10px;gap:8px">' + icon('eye', 18, '#7DAB87') + '<strong>Font size</strong></div>' +
      '<div class="subtle" style="font-size:0.9em;margin-bottom:14px">Make the text bigger or smaller for comfort.</div>' +
      '<div class="row" style="gap:14px"><button class="font-btn" onclick="changeFont(-2)">&minus;</button>' +
        '<div style="font-size:1.1em;font-weight:700;min-width:60px;text-align:center">' + state.fontSize + 'px</div>' +
        '<button class="font-btn" onclick="changeFont(2)">+</button><button class="nav-btn" onclick="resetFont()" style="margin-left:8px">Reset</button></div></div>' +
    '<div><div class="row" style="margin-bottom:10px;gap:8px">' + icon('refresh', 18, '#C97A7A') + '<strong>Reset all progress</strong></div>' +
      '<div class="subtle" style="font-size:0.9em;margin-bottom:14px">Clear read lessons, quiz answers, and the review queue.</div>' +
      '<button class="nav-btn" onclick="resetProgress()" style="border-color:#C97A7A;color:#C97A7A">Reset progress</button></div></div></div>';
}
function render() {
  let body = '';
  if (state.view === 'home') body = renderHome();
  else if (state.view === 'learn' && !state.topicId) body = renderLearnList();
  else if (state.view === 'learn' && state.topicId) body = renderLearnCard();
  else if (state.view === 'quiz') body = renderQuiz();
  document.getElementById('app').innerHTML = '<div class="container">' + renderHeader() + renderTabs() + body + '</div>' + renderSettings();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

// =================== ACTIONS ===================
function resetQuizAnswer() { state.quizAnswer = null; state.quizSelection = []; }
function go(view) { state.exam = emptyExam(); state.view = view; state.topicId = null; resetQuizAnswer(); render(); }
function openTopic(id) { state.exam = emptyExam(); state.view = 'learn'; state.topicId = id; state.cardIdx = 0; resetQuizAnswer(); render(); }
function openTopicAt(id, idx) { state.exam = emptyExam(); state.view = 'learn'; state.topicId = id; state.cardIdx = idx; resetQuizAnswer(); render(); }
function backToLearnList() { state.topicId = null; render(); }
function prevCard() { if (state.cardIdx > 0) { state.cardIdx--; render(); } }
function nextCard() { const cards = CARDS[state.topicId]; if (state.cardIdx < cards.length - 1) { state.cardIdx++; render(); } }
function toggleLearned(id) { if (state.progress.learned[id]) delete state.progress.learned[id]; else state.progress.learned[id] = true; saveProgress(); render(); }
function openQuiz() { state.exam = emptyExam(); state.view = 'quiz'; state.quizMode = 'all'; state.quizIdx = 0; resetQuizAnswer(); render(); }
function openReview() { state.exam = emptyExam(); state.view = 'quiz'; state.quizMode = 'review'; state.quizIdx = 0; resetQuizAnswer(); render(); }
function startExam() { state.exam = startExamSession(); state.view = 'quiz'; state.quizMode = 'exam'; state.quizIdx = 0; resetQuizAnswer(); render(); }
function startQuiz(mode) { if (mode === 'exam') { startExam(); return; } state.exam = emptyExam(); state.quizMode = mode; state.quizIdx = 0; resetQuizAnswer(); render(); }
function changeQuizMode(mode) { if (mode === 'exam') { startExam(); return; } state.exam = emptyExam(); state.quizMode = mode; state.quizIdx = 0; resetQuizAnswer(); render(); }
function chooseQuizOption(idx) {
  if (state.quizAnswer !== null) return;
  const q = currentQuestion();
  if (!q) return;
  if (isMultiQuestion(q)) {
    const selected = new Set(state.quizSelection);
    if (selected.has(idx)) selected.delete(idx); else selected.add(idx);
    state.quizSelection = [...selected].sort((a, b) => a - b);
    render();
    return;
  }
  state.quizSelection = [idx];
  submitQuizAnswer();
}
function submitQuizAnswer() {
  if (state.quizAnswer !== null || state.quizSelection.length === 0) return;
  const q = currentQuestion();
  if (!q) return;
  const answer = state.quizSelection.slice().sort((a, b) => a - b);
  const isCorrect = sameAnswerSet(answer, correctAnswers(q));
  state.quizAnswer = answer;
  if (state.exam.active) {
    state.exam.answers[q.id] = { answer, correct: isCorrect };
  } else {
    state.progress.answered[q.id] = isCorrect;
    const wrongSet = new Set(state.progress.wrongQueue);
    if (isCorrect) wrongSet.delete(q.id); else wrongSet.add(q.id);
    state.progress.wrongQueue = [...wrongSet];
    saveProgress();
  }
  render();
}
function prevQuiz() {
  if (state.quizIdx > 0) {
    state.quizIdx--;
    const q = currentQuestion();
    state.quizAnswer = state.exam.active && q && state.exam.answers[q.id] ? state.exam.answers[q.id].answer.slice() : null;
    state.quizSelection = state.quizAnswer ? state.quizAnswer.slice() : [];
    render();
  }
}
function nextQuiz() {
  const pool = currentQuizPool();
  if (state.quizIdx < pool.length - 1) {
    state.quizIdx++;
    const q = currentQuestion();
    state.quizAnswer = state.exam.active && q && state.exam.answers[q.id] ? state.exam.answers[q.id].answer.slice() : null;
    state.quizSelection = state.quizAnswer ? state.quizAnswer.slice() : [];
    render();
  }
}
function restartQuiz() { if (state.exam.active) startExam(); else { state.quizIdx = 0; resetQuizAnswer(); render(); } }
function finishExam(expired) {
  if (!state.exam.active) return;
  const wrongSet = new Set(state.progress.wrongQueue);
  currentQuizPool().forEach(q => {
    const result = state.exam.answers[q.id];
    if (!result || !result.correct) wrongSet.add(q.id); else wrongSet.delete(q.id);
  });
  state.progress.wrongQueue = [...wrongSet];
  saveProgress();
  state.exam.complete = true;
  state.exam.expired = !!expired;
  resetQuizAnswer();
  render();
}
function toggleSettings() { state.showSettings = !state.showSettings; render(); }
function changeFont(d) { state.fontSize = Math.max(14, Math.min(28, state.fontSize + d)); saveFont(); applyFont(); render(); }
function resetFont() { state.fontSize = 18; saveFont(); applyFont(); render(); }
function resetProgress() { if (confirm('Reset all progress? This cannot be undone.')) { state.progress = emptyProgress(); state.exam = emptyExam(); saveProgress(); render(); } }

// =================== BOOT ===================
state.progress = loadProgress();
state.fontSize = loadFont();
applyFont();
render();
setInterval(() => {
  if (state.exam.active && !state.exam.complete) {
    if (examTimeRemainingMs() <= 0) finishExam(true);
    else updateTimerBadge();
  }
}, 1000);
</script>
</body>
</html>
